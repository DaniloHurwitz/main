<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background:  #f7f8fa;
      color:       #161616;
      min-height:  100vh;
      display:     flex;
      align-items: center;
      justify-content: center;
      padding:     2rem;
    }

    .container {
      text-align:  center;
      max-width:   420px;
    }

    .code {
      font-size:   6rem;
      font-weight: 800;
      color:       #e0e0e0;
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -4px;
    }

    h1 {
      font-size:     1.25rem;
      font-weight:   600;
      margin-bottom: 0.75rem;
      color:         #161616;
    }

    p {
      font-size:     0.9375rem;
      color:         #525252;
      line-height:   1.6;
      margin-bottom: 1.75rem;
    }

    a {
      display:      inline-block;
      padding:      0.625rem 1.25rem;
      background:   #0043ce;
      color:        #fff;
      border-radius: 6px;
      text-decoration: none;
      font-size:    0.9rem;
      font-weight:  500;
      transition:   background 0.15s;
    }

    a:hover { background: #0035a8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La dirección que ingresaste no existe o fue movida.</p>
    <a href="#" onclick="history.back(); return false;">Volver atrás</a>
  </div>
</body>
</html>
