<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repaso final de Histología I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --slide:#FBF8FC; --paper:#FFFFFF; --ink:#271F3B; --muted:#6B6280;
  --hema:#4A3A99; --hema-wash:#ECE8FA; --eosin:#C93C76; --eosin-wash:#FBE4EE;
  --line:#E2DAEC; --ok:#2F7A5C; --ok-wash:#E1F2EA; --bad:#B8323F; --bad-wash:#FBE5E7;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --slide:#15111D; --paper:#1E1829; --ink:#ECE6F5; --muted:#A79FBA;
    --hema:#B3A6F4; --hema-wash:#2A2346; --eosin:#F08BB4; --eosin-wash:#3B1F2E;
    --line:#342B45; --ok:#7FD1AB; --ok-wash:#173328; --bad:#F2919A; --bad-wash:#3A1C21;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --slide:#15111D; --paper:#1E1829; --ink:#ECE6F5; --muted:#A79FBA;
  --hema:#B3A6F4; --hema-wash:#2A2346; --eosin:#F08BB4; --eosin-wash:#3B1F2E;
  --line:#342B45; --ok:#7FD1AB; --ok-wash:#173328; --bad:#F2919A; --bad-wash:#3A1C21;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--slide);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.62;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--eosin);outline-offset:2px;border-radius:6px}
.wrap{max-width:780px;margin:0 auto;padding:0 18px}

/* Cabecera */
.mast{padding:28px 0 18px;display:flex;gap:18px;align-items:center}
.field{flex:0 0 auto;width:76px;height:76px}
.mast h1{font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.mast p{margin:6px 0 0;color:var(--muted);font-family:var(--sans);font-size:.95rem}
.themebtn{margin-left:auto;align-self:flex-start;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-family:var(--sans);font-size:.85rem;white-space:nowrap}

/* Navegación de temas */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--slide);border-bottom:1px solid var(--line)}
.topnav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 14px;font-family:var(--sans);font-size:.9rem;white-space:nowrap}
.chip[aria-current="page"]{background:var(--hema);border-color:var(--hema);color:var(--paper)}
.chip.alt{border-style:dashed}
a.chip,a.trow,a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:var(--paper)}

main{padding:22px 0 80px}
h2{font-size:1.65rem;line-height:1.2;margin:0 0 4px}
h3{font-size:1.15rem;margin:0 0 8px}
.src{font-family:var(--sans);font-size:.85rem;color:var(--muted);margin:0 0 18px}
.muted{color:var(--muted)}
.sans{font-family:var(--sans)}

/* Pestañas de modo */
.modes{display:flex;flex-wrap:wrap;gap:4px;background:var(--hema-wash);padding:4px;border-radius:12px;margin:0 0 22px}
.modes button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-family:var(--sans);font-size:.9rem;font-weight:500;color:var(--ink)}
.modes button[aria-selected="true"]{background:var(--paper);box-shadow:0 1px 0 var(--line);color:var(--hema);font-weight:600}

/* Inicio */
.intro{font-size:1.05rem;margin:0 0 22px}
.tlist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.trow:hover{border-color:var(--hema)}
.trow .tn{font-weight:600;font-size:1.08rem}
.trow .tc{font-family:var(--sans);font-size:.82rem;color:var(--muted)}
.trow .pct{font-family:var(--sans);font-size:.85rem;color:var(--muted);grid-row:1 / span 2;grid-column:2}
.stain{grid-column:1 / -1;height:8px;border-radius:99px;background:var(--hema-wash);overflow:hidden;margin-top:6px}
.stain i{display:block;height:100%;background:linear-gradient(90deg,var(--eosin),var(--hema));border-radius:99px;transition:width .4s}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}

/* Resumen */
.sec{border-top:1px solid var(--line);padding:18px 0}
.sec:first-of-type{border-top:0;padding-top:0}
.sec p{margin:0 0 10px}
.sec ul,.sec ol{margin:0 0 10px;padding-left:1.3em}
.sec li{margin:3px 0}
.formula{font-family:var(--sans);font-weight:600;background:var(--hema-wash);color:var(--hema);display:inline-block;padding:6px 12px;border-radius:8px;margin:4px 0 10px}
.tw{overflow-x:auto;margin:6px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:.88rem;line-height:1.45}
th,td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--hema-wash);font-weight:600}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:500}
details.sec summary{cursor:pointer;font-weight:600;font-size:1.15rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:"+";font-family:var(--sans);color:var(--muted)}
details.sec[open] summary::after{content:"−"}
details.sec[open] summary{margin-bottom:10px}

/* Nivel */
.lvl{font-family:var(--sans);font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;display:inline-block}
.l1{background:var(--ok-wash);color:var(--ok)}
.l2{background:var(--hema-wash);color:var(--hema)}
.l3{background:var(--eosin-wash);color:var(--eosin)}

/* Barra de herramientas */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;font-family:var(--sans);font-size:.9rem}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 14px;font-family:var(--sans);font-size:.92rem;font-weight:500}
.btn:hover{border-color:var(--hema)}
.btn.pri{background:var(--hema);border-color:var(--hema);color:var(--paper)}
.btn.ok{background:var(--ok-wash);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
label.tog{display:inline-flex;gap:6px;align-items:center}

/* Flashcard */
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:240px;display:flex;flex-direction:column;gap:12px;cursor:pointer;width:100%;text-align:left}
.card .q{font-size:1.3rem;font-weight:600;line-height:1.3}
.card .a{border-top:2px dashed var(--eosin);padding-top:12px;font-size:1.05rem}
.card .hint{margin-top:auto;font-family:var(--sans);font-size:.82rem;color:var(--muted)}
.card.known{border-color:var(--ok)}
.card.review{border-color:var(--eosin)}
.fcnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.fcnav .wide{grid-column:1 / -1}

/* Preguntas */
.qbox{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
.qbox .q{font-size:1.18rem;font-weight:600;margin:8px 0 14px;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--slide);border-radius:12px;padding:11px 14px;width:100%;font-family:var(--serif);font-size:1rem}
.opt .k{font-family:var(--sans);font-weight:600;color:var(--muted);min-width:1.2em}
.opt:hover:not(:disabled){border-color:var(--hema)}
.opt.right{background:var(--ok-wash);border-color:var(--ok)}
.opt.wrong{background:var(--bad-wash);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.97rem}
.fb.okk{background:var(--ok-wash)}
.fb.no{background:var(--bad-wash)}
.prog{height:6px;background:var(--hema-wash);border-radius:99px;overflow:hidden;margin:0 0 14px}
.prog i{display:block;height:100%;background:var(--hema)}
.score{font-size:2.6rem;font-weight:700;line-height:1;margin:6px 0}
.miss{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.miss li{border-left:3px solid var(--bad);padding:6px 12px;background:var(--paper);border-radius:0 10px 10px 0}

/* V o F */
.vf{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.vf li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.vf .st{margin:6px 0 10px}
.vf .row{display:flex;gap:8px}

/* Desarrollo */
.dev{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.dev li{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.dev .q{font-weight:600;font-size:1.08rem;margin:6px 0 10px}
.dev textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--slide);font-family:var(--serif);font-size:.98rem;resize:vertical}
.model{margin-top:12px;padding:12px 14px;background:var(--hema-wash);border-radius:12px}
.model ul,.model ol{margin:0;padding-left:1.2em}
.model .tw{background:var(--paper)}
.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted);font-family:var(--sans)}

@media (max-width:520px){
  body{font-size:16px}
  .mast{padding-top:20px}
  .field{width:58px;height:58px}
  .card .q{font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

        <path d="M-5 70 Q25 58 55 74 T110 66" stroke="var(--eosin)" stroke-width="7" fill="none" opacity=".45"/>
        <ellipse cx="24" cy="24" rx="7" ry="5" fill="var(--hema)"/>
        <ellipse cx="62" cy="20" rx="5" ry="6" fill="var(--hema)"/>
        <ellipse cx="44" cy="48" rx="8" ry="6" fill="var(--hema)"/>
        <ellipse cx="78" cy="46" rx="6" ry="5" fill="var(--hema)"/>
        <ellipse cx="20" cy="58" rx="5" ry="7" fill="var(--hema)"/>
        <ellipse cx="58" cy="80" rx="7" ry="5" fill="var(--hema)"/>
        <ellipse cx="32" cy="86" rx="5" ry="4" fill="var(--hema)"/>
        <ellipse cx="84" cy="76" rx="5" ry="6" fill="var(--hema)"/>

      <h1>Histología I, repaso final</h1>
      <p>Siete temas de la cátedra, de lo básico a lo avanzado.</p>

    <button class="themebtn" id="theme" type="button">Modo noche</button>
  </header>
</div>

<script>
const TEMAS = [];

TEMAS.push({
id:"micro", nombre:"Microscopía",
fuente:"Apunte «Microscopía y Técnica Histológica» (2023)",
resumen:[
["Unidades de medida", `<ul>
<li><b>Micrómetro (µm)</b> = 0,001 mm: células, núcleos, organoides grandes.</li>
<li><b>Nanómetro (nm)</b> = 0,001 µm: organoides pequeños, macromoléculas, virus.</li>
<li><b>Ángstrom (Å)</b> = 0,1 nm: moléculas y átomos.</li>
<li>Milímetro: células grandes (musculares, prolongaciones neuronales). Centímetro: algunos huevos (la yema del huevo de gallina es una célula).</li></ul>
<p>Referencias: glóbulo rojo ≈7 µm (la «regla» para estimar tamaños al MO porque aparece en casi todos los cortes), ovocito ≈100 µm, espermatozoide ≈60 µm de largo, bacteria ≈1,5 µm.</p>`],
["Microscopio óptico compuesto (MOC)", `<p>Usa luz visible (también se lo llama de luz o fotónico) y observa por <b>transiluminación</b>: la luz atraviesa cortes finísimos o extendidos de células. Se llama <b>compuesto</b> porque tiene dos sistemas de lentes acoplados: el objetivo y el ocular. Brinda detalles de la estructura celular y tisular.</p>
<p><b>Parte mecánica:</b> pie (apoyo pesado, da estabilidad), columna (con los tornillos macrométrico, de movimiento rápido, y micrométrico, de movimiento lento), tubo (sostiene ocular y objetivo), platina (con orificio central y charriot para mover el portaobjetos) y subplatina (diafragma que regula la luz, soporte del condensador, aro portafiltros; debajo, el espejo).</p>
<p><b>Parte óptica:</b> fuente de luz; condensador (lentes convergentes que concentran la luz en forma de cono sobre el preparado; se sube o se baja); objetivos (4x, 10x, 25x, 40x y 100x; el de 100x es de <b>inmersión</b> y los demás son «secos»; combinan lentes para corregir las aberraciones cromática y de esfericidad); oculares (7 a 15x, por lo común 10x; mono o binoculares).</p>`],
["Formación de la imagen", `<ul>
<li>El <b>objetivo</b> forma una imagen <b>real, aumentada e invertida</b>.</li>
<li>El <b>ocular</b> la toma y forma una imagen <b>virtual, aumentada y derecha</b> respecto de la del objetivo.</li>
<li>En conjunto, el MOC da una imagen <b>virtual, aumentada e invertida</b> respecto del objeto.</li>
<li><b>Aumento total</b> = aumento del objetivo × aumento del ocular (40x × 10x = 400x).</li></ul>`],
["Poder y límite de resolución", `<p><b>Poder de resolución:</b> capacidad de un sistema óptico de mostrar como separados dos puntos muy próximos. Se expresa con su inversa, el <b>límite de resolución (LR)</b>: la distancia mínima que debe haber entre dos puntos para verlos individualizados.</p>
<ul><li>LR del mejor MO ≈ <b>0,2 µm</b> (dos puntos a menos de esa distancia se ven como uno).</li><li>LR del ojo humano ≈ <b>0,2 mm</b>.</li></ul>
<p class="formula">LR = k · λ / AN</p>
<p>k = constante (0,61); λ = longitud de onda de la luz (visible: 380 a 700 nm); AN = apertura numérica del objetivo (viene grabada en la montura).</p>
<p class="formula">AN = n · sen µ</p>
<p>n = índice de refracción del medio entre el objeto y la lente; µ = semiángulo de apertura. La AN expresa cuánta luz capta el objetivo.</p>
<p><b>Para mejorar la resolución (bajar el LR):</b> disminuir λ (luz UV, electrones) o aumentar la AN (objetivo con <b>aceite de inmersión</b>: tiene el mismo índice de refracción que el vidrio, evita que los rayos se desvíen hacia afuera y entran más rayos a formar la imagen).</p>`],
["Microscopios ópticos especiales", `<div class="tw"><table><tr><th>Microscopio</th><th>Fundamento</th><th>Uso</th></tr>
<tr><td>Fondo oscuro</td><td>Luz oblicua que no atraviesa el objeto; el objeto se ve brillante sobre fondo no iluminado</td><td>Elementos muy pequeños, como bacterias</td></tr>
<tr><td>Fluorescencia</td><td>Luz UV (invisible y dañina para el ojo); detecta sustancias fluorescentes</td><td>Inmunohistoquímica e histoquímica</td></tr>
<tr><td>Luz ultravioleta</td><td>λ ≈200 nm (menos de la mitad de la visible); LR ≈0,1 µm; imagen en placa fotográfica</td><td>Detectar ácidos nucleicos</td></tr>
<tr><td>Luz polarizada</td><td>Prismas de Nicol hacen vibrar la luz en un solo plano. Isótropo (monorrefringente): la luz pasa igual en cualquier plano. Anisótropo (birrefringente): la velocidad varía</td><td>Fibras colágenas y banda A del sarcómero (anisótropas)</td></tr>
<tr><td>Contraste de fase</td><td>Convierte diferencias de fase en diferencias de brillo</td><td>Células vivas sin teñir</td></tr>
<tr><td>Contraste interferencial</td><td>Como el de fase, pero da imágenes coloreadas y cuantifica la masa por densidad óptica</td><td>Cuantificar componentes</td></tr>
<tr><td>Confocal</td><td>Láser que barre la muestra plano por plano; una computadora arma la imagen</td><td>Imágenes tridimensionales</td></tr></table></div>`],
["Microscopios electrónicos", `<p>Usan un haz de <b>electrones</b> (λ ≈0,1 nm) en lugar de luz, lo que baja muchísimo el LR. Muestran la <b>ultraestructura</b>: organoides, membranas, virus, macromoléculas.</p>
<p><b>MET (transmisión):</b> tubo vertical de más de 1 m con: <b>cátodo</b> (filamento de tungsteno calentado que emite electrones), <b>ánodo</b> (los acelera), tres <b>bobinas electromagnéticas</b> que actúan como lentes (condensadora, objetivo y de proyección), <b>pantalla fluorescente</b> y <b>sistema de alto vacío</b> (para que los electrones no se dispersen). La muestra es un corte ultrafino; zonas <b>oscuras</b> = electrones muy desviados; zonas <b>claras</b> = poco desviados. LR hasta ≈1 Å; aumenta ≈1.000.000 de veces (el MO ≈2000). Desventajas: técnicas complejas y costosas, no se pueden ver estructuras vivas (alto vacío) y no se colorea (el colorante impediría el paso de electrones); imagen en blanco y negro.</p>
<p><b>MEB o SEM (barrido):</b> imagen <b>tridimensional de la superficie</b>. LR ≈25 nm; ≈30.000x; gran profundidad de foco (hasta insectos pequeños). La muestra se recubre con una capa delgada de metal y se barre con electrones; un detector arma la imagen en una pantalla.</p>`]
],
fc:[
[1,"¿Por qué el microscopio óptico se llama «compuesto»?","Porque tiene dos sistemas de lentes acoplados: el objetivo (inferior) y el ocular (superior)."],
[1,"¿Cuánto mide un glóbulo rojo y para qué sirve saberlo?","≈7 µm en casi todos los mamíferos. Como aparece en casi todos los cortes, sirve de regla para estimar tamaños al MO."],
[1,"Equivalencias: µm, nm y Å","1 µm = 0,001 mm. 1 nm = 0,001 µm. 1 Å = 0,1 nm."],
[1,"Componentes de la parte mecánica del MOC","Pie, columna (tornillos macro y micrométrico), tubo, platina (con charriot) y subplatina (diafragma, soporte del condensador, aro portafiltros; debajo, el espejo)."],
[1,"Componentes de la parte óptica del MOC","Fuente de luz, condensador, objetivos y oculares."],
[1,"Tornillo macrométrico vs micrométrico","Macrométrico: movimiento rápido (enfoque grueso). Micrométrico: movimiento lento (enfoque fino)."],
[1,"¿Qué hace el condensador?","Sistema de lentes convergentes en la subplatina que concentra la luz en forma de cono sobre el preparado. Se sube o baja para regular la concentración del haz."],
[1,"¿Cómo se calcula el aumento total del MOC?","Aumento del objetivo × aumento del ocular (ej.: 40x × 10x = 400x)."],
[2,"¿Cómo es la imagen que forma el objetivo?","Real, aumentada e invertida."],
[2,"¿Cómo es la imagen que forma el ocular?","Virtual, aumentada y derecha respecto de la del objetivo."],
[2,"Imagen final del MOC","Virtual, aumentada e invertida respecto del objeto."],
[2,"¿Qué es un objetivo de inmersión?","El de 100x: requiere una gota de aceite con el mismo índice de refracción que el vidrio entre el preparado y la lente. Los de menor aumento son «secos»."],
[2,"Poder de resolución vs límite de resolución","Poder: capacidad de mostrar separados dos puntos muy próximos. Límite: distancia mínima entre dos puntos para verlos separados. Son inversos."],
[2,"Límite de resolución del MO y del ojo humano","MO: ≈0,2 µm. Ojo: 0,2 mm."],
[3,"Fórmula del límite de resolución","LR = k · λ / AN. k = 0,61; λ = longitud de onda (visible 380–700 nm); AN = apertura numérica del objetivo."],
[3,"Fórmula de la apertura numérica","AN = n · sen µ. n: índice de refracción del medio entre objeto y lente; µ: semiángulo de apertura."],
[3,"Dos formas de mejorar la resolución","Disminuir λ (luz UV, electrones) o aumentar la AN (aceite de inmersión)."],

[2,"Microscopio de fondo oscuro","Luz oblicua que no atraviesa el objeto, que se ve brillante sobre fondo negro. Para elementos muy pequeños como bacterias."],

[2,"Describí las partes del microscopio óptico compuesto y la función de cada una.",`<ul><li><b>Parte mecánica:</b> pie (apoyo y estabilidad); columna (une el pie al resto, lleva los tornillos macrométrico —rápido— y micrométrico —lento—); tubo (sostiene ocular y objetivos, puede tener cabezal móvil); platina (sostiene el preparado, orificio central para la luz, charriot para moverlo); subplatina (diafragma que regula la luz, soporte del condensador, aro portafiltros) y espejo si la fuente es externa.</li><li><b>Parte óptica:</b> fuente de luz (natural o artificial); condensador (concentra la luz en cono sobre la muestra); objetivos en revólver (4x a 100x; producen imagen real, aumentada e invertida; corrigen aberraciones); oculares (7–15x; imagen virtual, aumentada y derecha respecto de la del objetivo).</li></ul>`],
[2,"Explicá cómo se forma la imagen en el MOC y cómo se calcula el aumento.",`<ul><li>La luz atraviesa el preparado (transiluminación) y entra al objetivo, que forma una imagen <b>real, aumentada e invertida</b>.</li><li>El ocular toma esa imagen y forma otra <b>virtual, aumentada y derecha</b> respecto de la anterior.</li><li>Resultado: imagen final <b>virtual, aumentada e invertida</b> respecto del objeto.</li><li>Aumento total = aumento del objetivo × aumento del ocular (ej.: 100x × 10x = 1000x).</li></ul>`],
[3,"Definí poder y límite de resolución, escribí la fórmula del LR y explicá cómo se mejora.",`<ul><li><b>Poder de resolución:</b> capacidad de mostrar separados dos puntos muy próximos. <b>LR:</b> distancia mínima entre dos puntos para verlos separados (inversa del poder). MO ≈0,2 µm; ojo 0,2 mm.</li><li><b>LR = k·λ/AN</b> (k = 0,61; λ = longitud de onda; AN = apertura numérica). <b>AN = n·sen µ</b>.</li><li>Para mejorar: <b>bajar λ</b> (UV: LR ≈0,1 µm; electrones: mucho menor) o <b>subir la AN</b> con objetivos de inmersión: el aceite tiene igual índice de refracción que el vidrio y evita que los rayos se pierdan.</li></ul>`],
[3,"Compará el MO, el MET y el MEB.",`<div class="tw"><table><tr><th></th><th>MO</th><th>MET</th><th>MEB</th></tr><tr><td>Radiación</td><td>Luz visible</td><td>Electrones</td><td>Electrones</td></tr><tr><td>LR</td><td>0,2 µm</td><td>≈1 Å</td><td>≈25 nm</td></tr><tr><td>Aumento</td><td>≈2000x</td><td>≈1.000.000x</td><td>≈30.000x</td></tr><tr><td>Imagen</td><td>Color, 2D, estructura</td><td>B/N, 2D, ultraestructura interna</td><td>B/N, 3D de superficie</td></tr><tr><td>Muestra</td><td>Cortes de 3–10 µm teñidos</td><td>Ultrafinos de 40–70 nm, sin color</td><td>Recubierta de metal</td></tr><tr><td>Limitaciones</td><td>Resolución</td><td>Caro, no vivo, no color</td><td>Menor resolución que el MET</td></tr></table></div>`],
[2,"Nombrá los microscopios ópticos especiales, su fundamento y una aplicación.",`<ul><li><b>Fondo oscuro:</b> luz oblicua; objeto brillante sobre fondo negro; bacterias.</li><li><b>Fluorescencia:</b> luz UV, sustancias fluorescentes; inmunohistoquímica.</li><li><b>Luz UV:</b> λ 200 nm, LR 0,1 µm, placa fotográfica; ácidos nucleicos.</li><li><b>Polarizada:</b> prismas de Nicol; distingue isótropo de anisótropo (colágeno, banda A).</li><li><b>Contraste de fase:</b> diferencias de fase → brillo; células vivas sin teñir.</li><li><b>Contraste interferencial:</b> imágenes coloreadas y cuantificación de masa.</li><li><b>Confocal:</b> láser plano por plano; imagen 3D.</li></ul>`]

resumen:[
["Los 10 pasos de la técnica de rutina (MO)", `<ol><li>Toma de muestra</li><li>Fijación</li><li>Deshidratación</li><li>Aclaración</li><li>Inclusión (en parafina)</li><li>Confección del taco</li><li>Corte</li><li>Montaje</li><li>Coloración</li><li>Montaje final</li></ol><p>Son técnicas <b>post mortem</b>: deben mostrar el máximo detalle y preservar la estructura original. Los pasos 1 y 2 suele hacerlos el veterinario a campo o en la clínica; el resto, el laboratorio.</p>`],
["1. Toma de muestra", `<p>Puede ser una <b>biopsia</b> (animal vivo) o una <b>necropsia</b> (cadáver). Requiere conocer anatomía (no confundir una glándula salival con un ganglio de la zona).</p><ul><li><b>Tamaño:</b> no más de 1 cm³; si es mayor, el fijador no penetra bien.</li><li><b>Incisión:</b> cortes netos con bisturí o tijera afilada; sin aplastar ni arrancar (pinzas atraumáticas).</li><li><b>Elección:</b> zona representativa; en patología, tejido sano y alterado.</li><li><b>Tiempo:</b> con premura, para fijar rápido.</li></ul>`],
["2. Fijación", `<p>Al separar la muestra, las células mueren: se desestabilizan las membranas y las enzimas lisosómicas la destruyen (<b>autólisis</b>); después, las enzimas de microorganismos del ambiente (<b>putrefacción</b>). La fijación impide ambas y conserva la muestra como en vida. Las neuronas se alteran a los ≈5 min; el músculo y el conectivo, a los ≈20 min.</p>
<p><b>Fijación física:</b> congelación-desecación (congelar a −160/−190 °C en nitrógeno líquido y deshidratar a −40 °C al vacío). Preserva composición química y enzimas; útil en diagnósticos intraquirúrgicos. Poco usada por poco práctica.</p>
<p><b>Fijación química:</b> los fijadores coagulan proteínas y estabilizan membranas. Un buen fijador conserva bien los componentes, actúa rápido y penetra bien, no interfiere en pasos posteriores, es fácil de conseguir y barato. El de rutina es el <b>formol al 10%</b> (1 parte de formol + 9 de agua corriente). Mezclas: <b>Bouin</b> (ácido pícrico, formol, ácido acético), <b>Zenker</b> y <b>Helly</b> (con bicloruro de mercurio).</p>
<ul><li>Recipiente de boca ancha, tapa hermética, de vidrio o plástico (no metal: se oxida).</li><li>Volumen de fijador: 20:1 a 40:1 respecto de la muestra; se agrega la muestra al fijador (no al revés) y queda totalmente sumergida.</li><li>Rótulo completo: propietario, especie, sexo, raza, edad, órgano, aspecto, diagnóstico presuntivo, fijador y fechas.</li><li>Duración: 24 h para 1 cm³.</li><li>Trucos: lavar suavemente vísceras huecas antes; serosas estiradas sobre telgopor; pulmón (flota) con algodón encima.</li><li>Después de fijar en formol, <b>lavar con agua</b>.</li></ul>`],
["3 a 6. Deshidratación, aclaración, inclusión y taco", `<p>Para cortar láminas finas hay que darle rigidez a la muestra incluyéndola en <b>parafina</b>, que no es soluble en agua.</p><ul><li><b>Deshidratación:</b> alcoholes de graduación creciente (70, 96, 100), agitando el frasco.</li><li><b>Aclaración:</b> xilol, benzol o toluol, miscibles en alcohol y en parafina. Paso intermedio que permite que la parafina penetre; sin él, la parafina queda en la superficie y el interior queda blando.</li><li><b>Inclusión:</b> parafina, sólida a temperatura ambiente y líquida entre 45 y 70 °C; penetra en el tejido y le da consistencia.</li><li><b>Taco:</b> molde cúbico con parafina líquida y la muestra; al solidificar se fija a un soporte. La orientación de la muestra decide si el corte será transversal o longitudinal.</li></ul>`],
["7 a 10. Corte, montaje, coloración y montaje final", `<ul><li><b>Corte:</b> micrótomo; láminas de <b>3 a 10 µm</b> (las células miden ≈10 µm; más espesor impediría enfocar bien). Hay micrótomos con taco móvil y cuchilla fija o al revés; cuchillas descartables o reafilables.</li><li><b>Montaje:</b> el corte se estira sobre agua tibia y se levanta con un portaobjetos tratado con <b>albúmina de Mayer</b> (clara de huevo + glicerina) o gelatina; se seca en estufa a 40 °C.</li><li><b>Coloración:</b> las células sin teñir son transparentes. Se usa H/E.</li><li><b>Montaje final:</b> cubreobjetos pegado con <b>Bálsamo de Canadá</b> (incoloro, índice de refracción similar al vidrio), evitando burbujas; luego se rotula (lápiz de punta de diamante o tinta indeleble).</li></ul>

[2,"Describí los 10 pasos de la técnica histológica de rutina para MO y el objetivo de cada uno.",`<ol><li><b>Toma de muestra:</b> obtener tejido representativo (≤1 cm³, cortes netos, rápido; biopsia o necropsia).</li><li><b>Fijación:</b> evitar autólisis y putrefacción (formol 10%, 20–40:1, 24 h/cm³; luego lavar con agua).</li><li><b>Deshidratación:</b> quitar el agua (alcohol 70, 96, 100) porque la parafina no es hidrosoluble.</li><li><b>Aclaración:</b> xilol/benzol/toluol, miscibles en alcohol y parafina, para que la parafina penetre.</li><li><b>Inclusión:</b> parafina líquida (45–70 °C) que da consistencia.</li><li><b>Taco:</b> bloque de parafina con la muestra orientada, fijado a un soporte.</li><li><b>Corte:</b> micrótomo, 3–10 µm.</li><li><b>Montaje:</b> estirar en agua tibia, recoger con portaobjetos con albúmina de Mayer, secar a 40 °C.</li><li><b>Coloración:</b> H/E para dar contraste.</li><li><b>Montaje final:</b> cubreobjetos con Bálsamo de Canadá y rotulado.</li></ol>`],
[2,"Fijación: autólisis, putrefacción, tipos de fijación, buen fijador y cuidados prácticos.",`<ul><li><b>Autólisis:</b> destrucción por las propias enzimas lisosómicas al morir la célula. <b>Putrefacción:</b> por enzimas de microorganismos.</li><li><b>Física:</b> congelación-desecación (−160/−190 °C y deshidratación a −40 °C al vacío); conserva enzimas; poco práctica.</li><li><b>Química:</b> fijadores coagulan proteínas y estabilizan membranas. Formol 10% (el mejor), mezclas como Bouin, Zenker, Helly.</li><li><b>Buen fijador:</b> buena conservación, rápido y penetrante, no interfiere, fácil y barato.</li><li><b>Cuidados:</b> frasco de boca ancha, vidrio o plástico; 20:1 a 40:1; muestra sumergida (se agrega al fijador); 24 h por cm³; rótulo completo; serosas sobre telgopor, pulmón con algodón; lavar luego con agua.</li></ul>`],
[2,"Explicá la técnica de H/E y los conceptos de basofilia y acidofilia.",`<ul><li><b>Basofilia:</b> afinidad de sustancias ácidas por colorantes básicos (núcleo, ribosomas, RER). <b>Acidofilia:</b> afinidad de sustancias básicas por colorantes ácidos (proteínas citoplasmáticas).</li><li><b>Hematoxilina:</b> natural (palo campeche), actúa como básica con mordientes de Al o Fe; azul-violeta.</li><li><b>Eosina:</b> sintética, ácida; rosado.</li><li>Resultado: núcleos azul-violeta, citoplasmas rosados; células con mucho RER, citoplasma basófilo.</li></ul>`],
[3,"Mencioná coloraciones especiales, qué ponen en evidencia y de qué color.",`<ul><li><b>PAS:</b> GAGs y glucógeno, fucsia.</li><li><b>Feulgen:</b> ADN, fucsia.</li><li><b>Sudán:</b> lípidos (con cortes por congelación).</li><li><b>Masson:</b> conectivo azul, músculo fucsia. <b>Mallory:</b> fibras azules, músculo rojo, elásticas amarillas. <b>Van Gieson:</b> colágeno rojo, epitelio y músculo amarillos.</li><li><b>Argénticas:</b> tejido nervioso y fibras reticulares (negro).</li><li><b>Metacromáticos</b> (azul de toluidina, tionina, azur A): GAGs y gránulos de mastocitos en rojo-púrpura.</li><li><b>Inmunohistoquímica:</b> moléculas específicas por antígeno-anticuerpo.</li></ul>`],
[3,"Compará el procesamiento para MO con el procesamiento para MET.",`<div class="tw"><table><tr><th>Paso</th><th>MO</th><th>MET</th></tr><tr><td>Muestra</td><td>≤1 cm³</td><td>≤1,5 mm³, muy rápido</td></tr><tr><td>Fijación</td><td>Formol 10%</td><td>Glutaraldehído + tetróxido de osmio (o Karnovsky)</td></tr><tr><td>Deshidratación</td><td>Alcoholes crecientes</td><td>Alcoholes o acetona</td></tr><tr><td>Intermediario</td><td>Xilol, benzol, toluol</td><td>Acetona u óxido de propileno</td></tr><tr><td>Inclusión</td><td>Parafina</td><td>Resinas epoxi, molde de pirámide trunca</td></tr><tr><td>Corte</td><td>Micrótomo, 3–10 µm</td><td>Ultramicrótomo: semifinos 0,5–1 µm y ultrafinos 40–70 nm</td></tr><tr><td>Soporte</td><td>Portaobjetos de vidrio</td><td>Grilla de cobre</td></tr><tr><td>Contraste</td><td>H/E y otras</td><td>Sales de uranilo, citrato de plomo</td></tr></table></div>`]

id:"epitelial", nombre:"Tejido epitelial",
fuente:"Apunte «Tejidos animales: Tejido epitelial» (Lacolla y García)",
resumen:[
["Los tejidos básicos", `<p><b>Tejido:</b> conjunto de células y componentes intercelulares relacionados anatómica o funcionalmente. Hay cuatro tejidos básicos:</p><ul><li><b>Epitelial:</b> células muy unidas con escasa sustancia intercelular. De revestimiento (membranas epiteliales) o glandular (exocrinas y endocrinas).</li><li><b>Conectivo y variedades:</b> sostiene, nutre, protege y defiende. Laxo, denso, mucoso; variedades: cartilaginoso, óseo, sangre, adiposo, linfático y hemopoyético.</li><li><b>Muscular:</b> esquelético, cardíaco y liso.</li><li><b>Nervioso:</b> neuronas y glía.</li></ul><p>Tejidos embrionarios: ectodermo, mesodermo, endodermo y neuroectodermo. El conectivo y el muscular vienen casi todo del mesodermo; el nervioso, del neuroectodermo; el epitelial, de cualquiera según dónde esté.</p>`],
["Definición y características del epitelio", `<p>Tejido de <b>origen variable</b>, formado por <b>células polarizadas</b> muy unidas con muy poca sustancia intercelular, apoyado sobre una <b>membrana basal</b> y <b>sin vascularización</b>.</p><ul><li><b>Origen:</b> ectodermo (epidermis, glándulas cutáneas, boca y ano); mesodermo (endotelios, mesotelios de pleura, pericardio y peritoneo, túbulos renales, vías urinarias y conductos genitales); endodermo (tubo digestivo, glándulas gástricas e intestinales, hígado y páncreas).</li><li><b>Polaridad:</b> cara apical (microvellosidades, cilias, salida de secreciones), caras laterales (complejos de unión) y cara basal (membrana basal).</li><li><b>Nutrición:</b> por difusión desde el conectivo subyacente a través de la membrana basal.</li></ul>`],
["Clasificación de los epitelios de revestimiento", `<p>Se clasifican por el <b>número de capas</b> (simple o estratificado) y la <b>forma de las células</b> (plana, cúbica o cilíndrica). En los estratificados manda la capa más superficial. Pseudoestratificado y de transición se describen aparte.</p>
<div class="tw"><table><tr><th>Epitelio</th><th>Ejemplos</th><th>Función destacada</th></tr>
<tr><td>Plano simple</td><td>Endotelios (vasos, corazón), mesotelios (pleura, pericardio, peritoneo), capa parietal de la cápsula de Bowman</td><td>Intercambio (el más delgado)</td></tr>
<tr><td>Cúbico simple</td><td>Túbulos renales, conductos excretores de glándulas</td><td>Secreción, absorción</td></tr>
<tr><td>Cilíndrico simple</td><td>Conductillos biliares, vesícula biliar, conductos glandulares</td><td>Absorción, secreción</td></tr>
<tr><td>Cilíndrico simple mucíparo</td><td>Estómago glandular</td><td>Moco continuo contra el HCl (PAS+, pálido con H/E)</td></tr>
<tr><td>Cilíndrico simple con chapa estriada y caliciformes</td><td>Intestino</td><td>Absorción (el mejor adaptado) + protección</td></tr>
<tr><td>Plano estratificado</td><td>Esófago, preestómagos de rumiantes, papilas gustativas</td><td>Protección</td></tr>
<tr><td>Plano estratificado queratinizado</td><td>Epidermis</td><td>Máxima protección (estrato córneo)</td></tr>
<tr><td>Cúbico y cilíndrico estratificados</td><td>Conductos de glándulas sudoríparas, conductos galactóforos</td><td>Los menos frecuentes</td></tr>
<tr><td>Cilíndrico pseudoestratificado ciliado con caliciformes</td><td>Vías respiratorias (fosas nasales, laringe, tráquea, bronquios)</td><td>Atrapar y barrer partículas</td></tr>
<tr><td>De transición (polimorfo, urotelio)</td><td>Solo vías urinarias</td><td>Adaptarse a la distensión</td></tr></table></div>
<p><b>Plano estratificado:</b> estrato basal o germinativo (cúbicas o cilíndricas bajas que se dividen y regeneran), intermedio y superficial (planas con núcleos cada vez más picnóticos). <b>Pseudoestratificado:</b> todas las células apoyan en la membrana basal pero no todas llegan a la superficie: núcleos a distintas alturas (es simple). <b>Transición:</b> basal cúbico o cilíndrico, intermedias poliédricas, superficiales esféricas grandes; con vejiga vacía muchas capas, llena pocas.</p>`],
["Región apical", `<p>Mira hacia el exterior o la luz; tiene glucocáliz, transportadores, canales y enzimas, y especializaciones:</p><ul><li><b>Microvellosidades:</b> prolongaciones digitiformes inmóviles que aumentan la superficie de absorción. Chapa estriada en el intestino (≈0,1 × 1 µm) y ribete en cepillo en túbulos renales (algo más largas). Proteínas: actina, villina, fimbrina, miosina I; se anclan al <b>velo terminal</b> (actina estabilizada por espectrina, con miosina y tropomiosina contráctiles: al contraerse separa las microvellosidades).</li><li><b>Estereocilias:</b> microvellosidades muy largas, sin villina (tienen ezrina y α-actinina). Epidídimo e inicio del conducto deferente; sensoriales en el oído.</li><li><b>Cilias:</b> móviles, 0,25 µm × 2–10 µm. Vías respiratorias y oviducto. Nacen de un <b>cuerpo basal</b> (centríolo modificado, 9 tripletes y sin par central). Axonema <b>9+2</b>: 9 pares periféricos (microtúbulo A completo y B incompleto) + par central. Brazos de <b>dineína</b> (ATPasa) del A al B vecino; <b>nexina</b> une pares; vaina central. Movimiento: golpe efectivo (rápido, rígido) y de recuperación (lento, flexionado); filas desfasadas dan una onda de barrido.</li></ul>`],
["Región lateral: complejo de unión", `<p>No se ve al MO. De apical a basal:</p><div class="tw"><table><tr><th>Unión</th><th>Forma</th><th>Proteínas transmembrana</th><th>Se ancla a</th><th>Función</th></tr>
<tr><td>Zonula occludens (ocluyente, estrecha)</td><td>Cinturón, la más apical; membranas como fusionadas</td><td>Ocludinas, claudinas, JAM</td><td>Actina vía ZO-1, ZO-2, ZO-3</td><td>Barrera al paso intercelular; delimita dominios de membrana. Las claudinas forman canales acuosos</td></tr>
<tr><td>Zonula adherens</td><td>Cinturón; espacio 20–30 nm</td><td>E-cadherina (Ca-dependiente)</td><td>Catenina, vinculina, α-actinina, actina</td><td>Unión fuerte; polaridad, diferenciación, migración</td></tr>
<tr><td>Macula adherens (desmosoma)</td><td>Puntiforme, «remache»; espacio 30 nm</td><td>Desmogleínas y desmocolinas (cadherinas, Ca-dependientes)</td><td>Placa (desmoplaquinas, placoglobinas) con filamentos intermedios de queratina en asa</td><td>La unión más fuerte</td></tr>
<tr><td>Unión de nexo (comunicante, hendidura)</td><td>Canales; conexón = 6 conexinas</td><td>Conexinas</td><td>No</td><td>Pasaje de iones y moléculas pequeñas; también en nervios, músculo liso y cardíaco</td></tr></table></div>
<p>Además hay <b>pliegues laterales</b> que aumentan la superficie de contacto (importantes en el intestino: bombas de Na/K mueven Na y agua al espacio intercelular).</p>`],
["Región basal", `<p><b>Membrana basal:</b> capa acelular, PAS+ y argirófila, entre epitelio y conectivo; en general no se ve con H/E. También rodea células musculares, adiposas y de Schwann.</p><ul><li><b>Lámina basal</b> (hecha por el epitelio, ≈50 proteínas): <b>lámina lúcida</b> (integrinas, laminina, fibronectina, entactina) y <b>lámina densa</b> (malla de <b>colágeno IV</b>; también XV, XVIII y VII —fibras de anclaje—; perlecano; fibronectina).</li><li><b>Lámina reticular</b> (hecha por el conectivo): colágenos III y I.</li><li><b>Funciones:</b> adhesión, separación, filtración selectiva, guía de regeneración, migración celular, diseminación tumoral.</li></ul>
<p><b>Uniones a la matriz:</b> <b>contactos focales</b> (talina + actina + integrinas que se unen a fibronectina; también migración y señales) y <b>hemidesmosomas</b> (medio desmosoma; placa con plectina, BP230 y erbina; integrinas NO Ca-dependientes unidas a laminina; en epitelios traccionados: epidermis, esófago, vagina).</p><p><b>Pliegues basales:</b> con mitocondrias entre ellos; aumentan el intercambio (conductos estriados, túbulos renales).</p>`],
["Glándulas: clasificación", `<p>Células o grupos de células cuya función es la <b>secreción</b> (captar compuestos de bajo PM, transformarlos y liberarlos). Las exocrinas siguen unidas al epitelio de origen; las endocrinas se independizan.</p><ol><li><b>Mecanismo:</b> merócrina (exocitosis de gránulos: acinos pancreáticos), apócrina (se pierde citoplasma apical: sudoríparas apócrinas), holócrina (la célula muere y es la secreción: sebácea).</li><li><b>Destino:</b> exocrina (al exterior por conductos), endocrina (a la sangre), parácrina (células vecinas), autócrina (la propia célula).</li><li><b>Número de células:</b> unicelulares (caliciformes, mucíparas) o multicelulares (superficie epitelial secretora como el estómago; glándulas intraepiteliales como en la tráquea de aves; glándulas con adenómero y conducto).</li><li><b>Adenómero:</b> acino (luz chica: páncreas), alvéolo (luz grande, cúbicas bajas: mamaria), túbulo (recto: intestino; glomerular: sudorípara), sáculo (sebácea) y combinaciones.</li><li><b>Conducto:</b> simple (Lieberkühn), simple ramificada (pilóricas), compuesta (salivales).</li><li><b>Secreción:</b> serosa, mucosa o mixta.</li></ol><p><b>Parénquima:</b> parte funcional (adenómeros y conductos). <b>Estroma:</b> conectivo de sostén (cápsula, tabiques que forman lóbulos y lobulillos, hilio). <b>Células mioepiteliales:</b> contráctiles, entre las glandulares y la membrana basal (sudoríparas, salivales, mamarias).</p>`],
["Conductos y tipos de secreción", `<p><b>Conductos de una glándula salival:</b> intercalar (sale del acino, cúbico simple, más chico que un acino) → intralobulillar (más grande que un acino) → interlobulillar (en los tabiques, rodeado de conectivo) → interlobular o lobular → conducto principal (epitelio cilíndrico, pseudoestratificado o estratificado). Los intra e interlobulillares pueden ser <b>excreto-secretores o estriados</b> por sus pliegues basales con mitocondrias.</p>
<div class="tw"><table><tr><th></th><th>Seroso</th><th>Mucoso</th><th>Mixto</th></tr><tr><td>Producto</td><td>Proteínas no glucosiladas (enzimas)</td><td>Glucoproteínas: mucina</td><td>Ambos</td></tr><tr><td>Luz</td><td>Muy pequeña</td><td>Relativamente amplia</td><td>—</td></tr><tr><td>Núcleo</td><td>Redondo, tercio basal</td><td>Aplanado contra la base</td><td>—</td></tr><tr><td>Tinción</td><td>Base basófila (RER), ápice acidófilo (gránulos)</td><td>Muy pálido con H/E</td><td>Centro mucoso + medialuna serosa de Gianuzzi</td></tr><tr><td>Ejemplo</td><td>Páncreas, parótida</td><td>Submaxilar, Lieberkühn, cardiales y pilóricas</td><td>Sublingual</td></tr></table></div>`],
["Glándulas endocrinas y renovación epitelial", `<p><b>Endocrinas:</b> sin conductos; células en cordones o acúmulos junto a muchos capilares; secretan <b>hormonas</b> que actúan en células blanco. Ej.: hipófisis, tiroides, adrenal. Hay además un <b>sistema neuroendocrino difuso</b> en el tubo digestivo y otros órganos.</p><p><b>Renovación:</b> intestino ≈cada 6 días; epidermis ≈mensual. Células madre: entre las demás en epitelios simples; las basales en el pseudoestratificado; el estrato basal en los estratificados; el fondo de las glándulas intestinales (forman células glandulares, cilíndricas y caliciformes). El hígado no se renueva normalmente pero regenera mucho ante una lesión.</p>`]
],
fc:[
[1,"Definición de tejido","Conjunto de células y componentes intercelulares que se relacionan anatómica o funcionalmente."],
[1,"Los cuatro tejidos básicos","Epitelial, conectivo (y variedades), muscular y nervioso."],
[1,"Tejidos embrionarios","Ectodermo, mesodermo, endodermo y neuroectodermo."],
[2,"Origen del epitelio según su ubicación","Ectodermo: epidermis, glándulas cutáneas, boca, ano. Mesodermo: endotelios, mesotelios, túbulos renales, vías urinarias y genitales. Endodermo: tubo digestivo, glándulas gástricas e intestinales, hígado, páncreas."],
[1,"Características que definen al epitelio","Origen variable, células polarizadas, muy unidas con escasa sustancia intercelular, apoyadas en membrana basal, sin vasos."],
[1,"¿Cómo se nutre el epitelio?","Por difusión desde el conectivo subyacente vascularizado, a través de la membrana basal."],
[1,"Criterios para clasificar epitelios de revestimiento","Número de capas (simple o estratificado) y forma celular (plana, cúbica, cilíndrica). En estratificados manda la capa superficial."],
[1,"Endotelio y mesotelio","Epitelios planos simples. Endotelio: vasos sanguíneos, linfáticos y corazón. Mesotelio: serosas (pleura, pericardio, peritoneo)."],
[1,"Ejemplos de epitelio cúbico simple","Túbulos renales y conductos excretores de muchas glándulas."],
[1,"Ejemplos de epitelio cilíndrico simple","Conductillos biliares, vesícula biliar, algunos conductos glandulares."],
[2,"Epitelio cilíndrico simple mucíparo","Estómago glandular. Células mucíparas que secretan moco en forma continua y protegen del HCl. Pálidas con H/E, PAS+. Se considera superficie epitelial secretora."],
[2,"Epitelio cilíndrico simple con chapa estriada y células caliciformes","Intestino. Microvellosidades (chapa estriada) para absorber + caliciformes que secretan moco en forma discontinua."],
[2,"Células mucíparas vs caliciformes","Mucíparas: secreción continua (estómago). Caliciformes: discontinua; acumulan gránulos de mucina en el ápice y los liberan (intestino, vías respiratorias)."],
[2,"Estratos del epitelio plano estratificado","Basal o germinativo (cúbicas o cilíndricas bajas que se dividen), intermedio y superficial (células planas con núcleos cada vez más picnóticos)."],
[1,"Ejemplos de plano estratificado no queratinizado","Esófago, preestómagos de rumiantes, papilas gustativas de la lengua."],
[1,"Plano estratificado queratinizado","Las células superficiales mueren y forman el estrato córneo (queratina, eosinófilo). Epidermis."],
[2,"Cúbico y cilíndrico estratificados","Los menos frecuentes. Conductos de glándulas sudoríparas y conductos galactóforos de la mamaria."],
[2,"¿Por qué el pseudoestratificado se considera simple?","Todas sus células apoyan en la membrana basal, aunque no todas llegan a la superficie; los núcleos a distintas alturas simulan estratos."],
[2,"Epitelio respiratorio","Cilíndrico pseudoestratificado ciliado con caliciformes: células basales, ciliadas y caliciformes. El moco atrapa partículas y las cilias lo barren."],
[2,"Epitelio de transición (urotelio)","Solo en vías urinarias. Basal cúbico/cilíndrico, intermedias poliédricas, superficiales esféricas grandes. Vejiga vacía: muchas capas; llena: pocas."],
[1,"Tres regiones de la célula epitelial","Apical, lateral y basal."],
[2,"Microvellosidades: estructura","Prolongaciones digitiformes inmóviles con actina, villina, fimbrina y miosina I; se anclan al velo terminal (actina + espectrina, con miosina y tropomiosina)."],
[2,"Chapa estriada vs ribete en cepillo","Ambas son microvellosidades: chapa estriada en el intestino (≈0,1 × 1 µm), ribete en cepillo en túbulos renales (algo más largas)."],
[2,"Estereocilias","Microvellosidades muy largas e inmóviles, sin villina (con ezrina y α-actinina). Epidídimo e inicio del deferente; sensoriales en el oído."],
[2,"¿Dónde hay cilias?","Cavidad nasal, laringe, tráquea, bronquios y oviducto (transporte del ovocito). Una sola cilia sensitiva en células del oído."],
[3,"Estructura 9+2 de la cilia","9 pares periféricos + 1 par central. Cada par: microtúbulo A (completo) y B (incompleto). Brazos de dineína (ATPasa) del A al B vecino; nexina une los pares; vaina central rodea al par central."],
[3,"Cuerpo basal","Centríolo modificado: 9 tripletes periféricos, sin par central. Hay tantos cuerpos basales como cilias."],
[3,"Movimiento ciliar","Golpe efectivo (rápido, cilia rígida) y de recuperación (lento, se flexiona). Filas desfasadas generan una onda de barrido."],
[2,"Componentes del complejo de unión (de apical a basal)","Zonula occludens, zonula adherens, desmosoma (macula adherens) y uniones de nexo."],
[2,"Zonula occludens","Cinturón más apical; sella el espacio intercelular y separa dominios de membrana. Ocludinas, claudinas y JAM, unidas a actina por ZO-1, ZO-2 y ZO-3."],
[3,"¿La zonula occludens es totalmente impermeable?","No: las claudinas forman canales acuosos que dejan pasar agua, iones y moléculas pequeñas."],
[2,"Zonula adherens","Cinturón por debajo de la ocluyente; espacio 20–30 nm. E-cadherina (Ca-dependiente), catenina, vinculina, α-actinina, actina."],
[2,"Desmosoma","Unión puntiforme y la más fuerte. Placa (desmoplaquinas, placoglobinas) que ancla filamentos intermedios de queratina en asa. Desmogleínas y desmocolinas (Ca-dependientes). Espacio 30 nm."],
[2,"Unión de nexo","Canales entre células vecinas; cada conexón = 6 conexinas. Pasan iones y moléculas pequeñas. También en nervios, músculo liso y cardíaco."],
[2,"Capas de la membrana basal","Lámina basal (lúcida + densa), hecha por el epitelio; lámina reticular (colágeno III y I), hecha por el conectivo."],
[3,"Lámina lúcida vs lámina densa","Lúcida: integrinas, laminina, fibronectina, entactina. Densa: malla de colágeno IV (más XV, XVIII y VII de anclaje), perlecano, fibronectina."],
[2,"Funciones de la membrana basal","Adhesión, separación, filtración selectiva, guía de regeneración, migración celular y diseminación de células tumorales."],
[1,"¿Cómo se ve la membrana basal al MO?","En general no se ve con H/E; es PAS+ y se evidencia con impregnación argéntica."],
[3,"Hemidesmosoma","Medio desmosoma en la cara basal: placa con plectina, BP230 (une filamentos intermedios) y erbina; integrinas no Ca-dependientes unidas a laminina. Epidermis, esófago, vagina."],
[3,"Contactos focales","Placas de talina unidas a actina y a integrinas que toman fibronectina. Fijan la célula, participan en la migración y transmiten señales."],
[2,"Pliegues basales","Aumentan la superficie de intercambio; tienen mitocondrias entre ellos. Conductos glandulares estriados y túbulos renales."],
[1,"Glándula exocrina vs endocrina","Exocrina: vierte al exterior por conductos. Endocrina: sin conductos, vierte hormonas a la sangre."],
[2,"Secreción parácrina y autócrina","Parácrina: al líquido extracelular, afecta a células vecinas. Autócrina: afecta a la propia célula."],
[1,"Seis criterios para clasificar glándulas","Mecanismo de secreción, sitio donde vuelcan, número de células, forma del adenómero, conducto y tipo de secreción."],
[1,"Merócrina, apócrina y holócrina","Merócrina: exocitosis de gránulos (acinos pancreáticos). Apócrina: pierde citoplasma apical (sudoríparas apócrinas). Holócrina: toda la célula es la secreción (sebácea)."],
[2,"Ejemplos de glándulas unicelulares","Células caliciformes (intestino) y mucíparas (estómago glandular)."],
[3,"Superficie epitelial secretora vs glándula intraepitelial","Superficie secretora: toda una capa de células secretoras (estómago). Intraepitelial: grupo de células secretoras dentro de un epitelio no secretor (tráquea de aves)."],
[2,"Parénquima vs estroma","Parénquima: parte funcional (adenómeros y conductos). Estroma: conectivo de sostén (cápsula, tabiques, hilio)."],
[2,"Formas de adenómero","Acino (páncreas), alvéolo (mamaria), túbulo recto (intestino) o glomerular (sudorípara), sáculo (sebácea) y combinaciones."],
[2,"Células mioepiteliales","Contráctiles, entre las células glandulares y la membrana basal; ayudan a expulsar la secreción. Sudoríparas, salivales, mamarias."],
[2,"Glándula simple, simple ramificada y compuesta","Simple: conducto sin ramificar (Lieberkühn). Simple ramificada: una unidad por rama (pilóricas). Compuesta: varias unidades por rama (salivales)."],
[3,"Secuencia de conductos de una glándula salival","Intercalar → intralobulillar → interlobulillar → interlobular (lobular) → principal."],
[3,"¿Por qué hay conductos llamados estriados?","Por los pliegues basales con mitocondrias; además de excretar, secretan (excreto-secretores)."],
[2,"Acino seroso","Luz muy pequeña, núcleo redondo en el tercio basal, base basófila (RER), ápice con gránulos acidófilos. Páncreas, parótida."],
[2,"Acino mucoso","Luz más amplia, núcleo aplanado contra la base, citoplasma muy pálido con H/E. Ej.: submaxilar."],
[2,"Acino mixto","Centro mucoso rodeado parcialmente por una medialuna serosa de Gianuzzi. Ej.: sublingual."],
[2,"Glándula endocrina","Sin conductos; cordones o acúmulos junto a capilares; hormonas hacia células blanco. Hipófisis, tiroides, adrenal. Sistema neuroendocrino difuso."],
[2,"Renovación epitelial","Intestino ≈6 días, epidermis ≈1 mes. Células madre en el estrato basal, células basales o fondo de las glándulas intestinales. El hígado regenera ante lesión."]
],

dev:[
[1,"Definí tejido epitelial y explicá sus características.",`<ul><li>Tejido de <b>origen variable</b> (ecto, meso o endodermo según su ubicación), formado por <b>células polarizadas</b>, muy unidas con escasa sustancia intercelular, apoyado sobre una <b>membrana basal</b> y <b>avascular</b>.</li><li>Polaridad: región apical (microvellosidades, cilias, salida de productos), lateral (complejo de unión) y basal (membrana basal, hemidesmosomas, pliegues).</li><li>Se nutre por difusión desde el conectivo a través de la membrana basal.</li><li>Dos grandes grupos: de revestimiento y glandulares.</li></ul>`],
[2,"Clasificá los epitelios de revestimiento con un ejemplo de cada tipo.",`<ul><li><b>Plano simple:</b> endotelios, mesotelios, cápsula de Bowman.</li><li><b>Cúbico simple:</b> túbulos renales.</li><li><b>Cilíndrico simple:</b> vesícula biliar; variante mucípara (estómago) y con chapa estriada y caliciformes (intestino).</li><li><b>Plano estratificado:</b> esófago; <b>queratinizado:</b> epidermis.</li><li><b>Cúbico/cilíndrico estratificado:</b> conductos de sudoríparas, galactóforos.</li><li><b>Pseudoestratificado ciliado con caliciformes:</b> tráquea.</li><li><b>De transición:</b> vejiga y vías urinarias.</li></ul>`],
[2,"Describí las especializaciones de la región apical.",`<ul><li><b>Microvellosidades:</b> prolongaciones digitiformes inmóviles (actina, villina, fimbrina, miosina I) ancladas al velo terminal; aumentan la superficie de absorción. Chapa estriada (intestino), ribete en cepillo (riñón).</li><li><b>Estereocilias:</b> microvellosidades largas sin villina; epidídimo, deferente; sensoriales en el oído.</li><li><b>Cilias:</b> móviles; axonema 9+2 con dineína y nexina; nacen de un cuerpo basal (9 tripletes). Golpe efectivo y de recuperación. Vías respiratorias (barren el moco) y oviducto (transporte del ovocito).</li></ul>`],
[3,"Describí el complejo de unión: componentes, proteínas, anclaje y función.",`<ol><li><b>Zonula occludens:</b> cinturón apical; ocludinas, claudinas, JAM; actina vía ZO-1/2/3; barrera al paso intercelular y separación de dominios de membrana.</li><li><b>Zonula adherens:</b> cinturón; E-cadherina (Ca-dependiente) → catenina → vinculina → α-actinina → actina; unión fuerte.</li><li><b>Desmosoma:</b> puntiforme; desmogleínas y desmocolinas; placa de desmoplaquinas y placoglobinas con filamentos intermedios de queratina; la unión más fuerte.</li><li><b>Unión de nexo:</b> conexones de 6 conexinas; comunicación de iones y moléculas pequeñas.</li></ol>`],
[3,"Describí la membrana basal y los medios de unión basales.",`<ul><li>Capa acelular PAS+ entre epitelio y conectivo; no se ve con H/E.</li><li><b>Lámina basal</b> (epitelial): lúcida (integrinas, laminina, fibronectina, entactina) y densa (colágeno IV, XV, XVIII, VII de anclaje, perlecano, fibronectina). <b>Lámina reticular</b> (conectiva): colágeno III y I.</li><li><b>Funciones:</b> adhesión, separación, filtración, guía de regeneración, migración, diseminación tumoral.</li><li><b>Contactos focales:</b> talina, actina, integrinas-fibronectina. <b>Hemidesmosomas:</b> plectina, BP230, erbina, integrinas no Ca-dependientes unidas a laminina. <b>Pliegues basales</b> con mitocondrias.</li></ul>`],
[2,"Clasificá las glándulas exocrinas según todos los criterios del apunte.",`<ul><li><b>Mecanismo:</b> merócrina (páncreas), apócrina (sudorípara apócrina), holócrina (sebácea).</li><li><b>Destino:</b> exocrina, endocrina, parácrina, autócrina.</li><li><b>N.º de células:</b> unicelulares (caliciformes, mucíparas) y multicelulares (superficie secretora, intraepiteliales, con adenómero y conducto).</li><li><b>Adenómero:</b> acino, alvéolo, túbulo (recto o glomerular), sáculo y mixtos.</li><li><b>Conducto:</b> simple, simple ramificada, compuesta.</li><li><b>Secreción:</b> serosa, mucosa, mixta.</li></ul>`],
[3,"Compará acinos serosos, mucosos y mixtos y describí los conductos de una glándula salival.",`<ul><li><b>Seroso:</b> proteínas no glucosiladas; luz muy pequeña; núcleo redondo basal; base basófila y ápice acidófilo; páncreas, parótida.</li><li><b>Mucoso:</b> mucina; luz más amplia; núcleo aplanado basal; pálido con H/E; submaxilar.</li><li><b>Mixto:</b> centro mucoso con medialuna serosa de Gianuzzi; sublingual.</li><li><b>Conductos:</b> intercalar (cúbico simple, del acino) → intralobulillar → interlobulillar (en tabiques) → interlobular → principal. Los intra e interlobulillares pueden ser estriados (pliegues basales con mitocondrias, también secretan).</li></ul>`]
]

resumen:[
["Definición y clasificación", `<p>Tejido de <b>origen mesodérmico</b>, formado por <b>distintos tipos celulares</b> y <b>sustancia intercelular</b> (fibras + sustancia amorfa). Está <b>vascularizado</b> y se encarga de unir, sostener, nutrir y defender a otros tejidos.</p><ul><li><b>Laxo:</b> predominan las <b>células</b>. Muy vascularizado, debajo de los epitelios (corion o lámina propia). Nutrición y defensa.</li><li><b>Denso:</b> predominan las <b>fibras</b>. Cápsulas, tabiques, dermis, ligamentos, tendones. Sostén.</li><li><b>Mucoso:</b> predomina la <b>sustancia amorfa</b>. Embrionario, cordón umbilical.</li></ul><p>Cartilaginoso, óseo, sangre, linfático y adiposo antes eran variedades del conectivo; hoy se estudian aparte por su especialización.</p>`],
["Células propias", `<div class="tw"><table><tr><th>Célula</th><th>Al MO / MET</th><th>Función</th></tr>
<tr><td>Fibroblasto</td><td>La más frecuente. Núcleo grande (~20 µm), oval, cromatina laxa, 1–2 nucléolos; citoplasma alargado, basófilo, poco visible. Mucho RER y Golgi</td><td>Sintetiza fibras y sustancia amorfa. Se divide en reparación (cicatrización)</td></tr>
<tr><td>Miofibroblasto</td><td>Igual al fibroblasto al MO; rasgos de músculo liso</td><td>Contráctil</td></tr>
<tr><td>Fibrocito</td><td>Núcleo alargado y más denso; escaso RER, muchos ribosomas libres. Abunda en el denso</td><td>Fibroblasto inactivo o viejo; puede reactivarse</td></tr>
<tr><td>Mesenquimática</td><td>Parece un fibroblasto pequeño</td><td>Indiferenciada, pluripotente; origina casi todas las del conectivo</td></tr>
<tr><td>Reticular</td><td>Estrellada, forma redes; núcleo como fibroblasto</td><td>Sintetiza fibras reticulares (conectivo y órganos linfáticos)</td></tr>
<tr><td>Pericito</td><td>Rodea endotelio de capilares y vénulas; comparte membrana basal</td><td>Rasgos de músculo liso y endotelio; se diferencia en otras células</td></tr>
<tr><td>Plasmocito</td><td>~20 µm, oval; núcleo excéntrico en «rueda de carro»; citoplasma basófilo (RER) con halo perinuclear claro (Golgi)</td><td>Deriva del linfocito B; sintetiza anticuerpos</td></tr>
<tr><td>Mastocito</td><td>20–30 µm, núcleo central, gránulos metacromáticos; receptores para IgE</td><td>Inflamación y alergia. Origen: médula ósea</td></tr>
<tr><td>Macrófago</td><td>10–30 µm, irregular, seudópodos; citoplasma basófilo vacuolado; núcleo excéntrico arriñonado. RER, Golgi y muchos lisosomas</td><td>Fagocitosis de partículas grandes; presenta antígenos. Sistema mononuclear fagocítico</td></tr>
<tr><td>Adiposa unilocular</td><td>~120 µm, esférica; una gota que empuja el núcleo: «anillo de sello»</td><td>Reserva de triglicéridos (grasa blanca)</td></tr>
<tr><td>Adiposa multilocular</td><td>Más chica, poligonal, núcleo central, varias gotas, muchas mitocondrias y citocromos</td><td>Reserva y producción de calor (grasa parda: hibernantes, recién nacidos)</td></tr>
<tr><td>Endotelial</td><td>Plana; reviste vasos</td><td>Es epitelial, pero algunos la incluyen por su origen mesodérmico y ubicación</td></tr></table></div>
<p><b>Gránulos del mastocito:</b> heparina (anticoagulante), histamina (vasodilatación y permeabilidad), factores quimiotácticos de neutrófilos y eosinófilos, leucotrienos (más potentes; broncoespasmo), prostaglandina D2 (broncoespasmo y más moco). Los basófilos que pasan al conectivo se vuelven indistinguibles de los mastocitos.</p>`],
["Células migrantes (leucocitos)", `<ul><li><b>Neutrófilos:</b> micrófagos; primeros en llegar; núcleo polilobulado (hasta 5 lóbulos); al morir forman pus.</li><li><b>Eosinófilos:</b> núcleo bilobulado, gránulos eosinófilos; fagocitan complejos antígeno-anticuerpo; acción antihistamínica.</li><li><b>Basófilos:</b> similares a mastocitos.</li><li><b>Monocitos:</b> al pasar al tejido se comportan como macrófagos.</li><li><b>Linfocitos:</b> T (inmunidad celular) y B (se transforman en plasmocitos).</li></ul><p>El conectivo laxo es «el campo de batalla» de la defensa.</p>`],
["Fibras", `<div class="tw"><table><tr><th></th><th>Colágenas</th><th>Reticulares</th><th>Elásticas</th></tr>

<tr><td>Tinción</td><td>Rosa con H/E; azul con Masson</td><td>No se ven con H/E; argirófilas (plata) y PAS+</td><td>Pálidas con H/E; marrón rojizo con orceína</td></tr>

<tr><td>Ubicación</td><td>Casi todo conectivo, tendones, ligamentos</td><td>Estroma de órganos linfáticos, hígado; alrededor de adipocitos, músculo liso, glándulas; lámina reticular</td><td>Laxo, ligamentos, arterias, pulmón</td></tr></table></div>`],
["El colágeno en detalle", `<ul><li><b>Jerarquía:</b> molécula de colágeno o tropocolágeno (300 nm × 1,5 nm; triple hélice de cadenas α) → fibrillas (hasta 300 nm; bandas de 68 nm al MET por el desfase de ¼ de longitud entre hileras) → fibras.</li><li><b>Aminoácidos:</b> glicina, lisina, prolina, hidroxiprolina, hidroxilisina. Las uniones covalentes entre moléculas vecinas dan la resistencia.</li><li><b>Síntesis:</b> ribosomas (preprocolágeno con péptidos de extensión, que evitan el armado intracelular) → RER (hidroxilación, glucosilación, triple hélice = procolágeno) → Golgi (oligosacáridos, empaquetado) → exocitosis → peptidasas cortan los péptidos de extensión (tropocolágeno) → fibrillas y fibras.</li></ul>
<div class="tw"><table><tr><th>Tipo</th><th>Lo sintetiza / dónde está</th></tr><tr><td>I</td><td>El más frecuente: fibroblastos, osteoblastos, odontoblastos, cementoblastos. Ligamentos, cápsulas, hueso, dientes</td></tr><tr><td>II</td><td>Condroblastos. Cartílago</td></tr><tr><td>III</td><td>Fibroblastos, células reticulares, músculo liso. Fibras reticulares</td></tr><tr><td>IV</td><td>Células epiteliales. Láminas basales</td></tr><tr><td>V</td><td>Fibroblastos, junto al I. Tendones, ligamentos, córnea</td></tr><tr><td>VI</td><td>Retículo alrededor de vasos y nervios</td></tr><tr><td>VII</td><td>Fibrillas de fijación de la lámina basal</td></tr><tr><td>XVIII</td><td>Angiogénesis</td></tr></table></div><p>Forman fibrillas con bandas: I, II, III, V y IX. Los demás forman reticulados. Hay 27 tipos (I a XXVII).</p>`],
["Sustancia amorfa (sustancia base)", `<p>No se ve con H/E pero llena todo el espacio entre células y fibras. Levemente PAS+ (mucha agua) y metacromática.</p><ul><li><b>GAGs:</b> cadenas no ramificadas de disacáridos (amino azúcar + ácido urónico) con carga negativa: atraen Na+ y agua. Sulfatados: queratán, dermatán, condroitín y heparán sulfato (PM 10.000–30.000). No sulfatado: ácido hialurónico (PM &gt;10.000.000).</li><li><b>Proteoglucanos:</b> GAGs unidos covalentemente a una proteína central («limpiatubos»).</li><li><b>Agrecanes:</b> muchos proteoglucanos unidos a una molécula de ácido hialurónico; enormes. Ej.: agrecano, perlecano, decorina; el sindecano queda unido a la membrana.</li><li><b>Glucoproteínas de adhesión:</b> fibronectina (une células a la matriz vía integrinas; se fija a heparán sulfato, hialurónico, colágenos I, II y III), laminina (membrana basal), tenascina (vías migratorias embrionarias), entactina (une laminina y colágeno), condronectina (cartílago), osteonectina (hueso).</li></ul><p><b>Funciones:</b> difusión de sustancias hidrosolubles, resistencia a la compresión, migración celular, frena invasores y células cancerosas, sitios para moléculas de señalamiento.</p>`],
["Inflamación", `<p>Mecanismo de defensa local (puede generalizarse) frente a lesiones traumáticas, químicas o infecciosas. Signos: <b>dolor, rubor, calor, tumefacción y pérdida de función</b>.</p><ol><li>Macrófagos fijos liberan citoquinas que aumentan la permeabilidad capilar; la histamina de los mastocitos produce vasodilatación.</li><li>Más flujo: llegan plasma y leucocitos.</li><li><b>Neutrófilos:</b> primeros; fagocitan y, al morir, forman pus.</li><li><b>Plasmocitos:</b> anticuerpos.</li><li><b>Eosinófilos:</b> fagocitan complejos antígeno-anticuerpo; regulan con su acción antihistamínica.</li><li><b>Mastocitos:</b> histamina, heparina y factores que atraen leucocitos.</li><li><b>Macrófagos y monocitos:</b> limpian restos; al final aparecen los <b>linfocitos</b>.</li></ol>`],
["Variedades de tejido conectivo", `<ul><li><b>Laxo:</b> todas las células descritas, sustancia amorfa relativamente abundante, pocas fibras; muy vascularizado e inervado; lámina propia del digestivo.</li><li><b>Denso irregular:</b> haces sin orientación definida (dermis).</li><li><b>Denso regular:</b> haces paralelos con fibrocitos entre ellos. Variedad <b>tendinosa</b> (fibras paralelas sin láminas: tendones), <b>aponeurótica</b> (láminas paralelas superpuestas: aponeurosis, ligamentos) y <b>corneal</b> (láminas superpuestas a 90°: córnea).</li><li><b>Denso elástico:</b> fibras elásticas en vez de colágenas (ligamento nucal, ligamentos laríngeos).</li><li><b>Mucoso:</b> sustancia amorfa gelatinosa, células mesenquimáticas, pocas fibras; embrión y cordón umbilical; en el adulto: cresta y barbillones del gallo, mucosa de algunos preestómagos, pulpa dentaria.</li></ul>`]

[1,"Definí tejido conectivo y clasificalo según el predominio de sus componentes.",`<ul><li>Tejido mesodérmico con células variadas y sustancia intercelular (fibras + sustancia amorfa); vascularizado; une, sostiene, nutre y defiende.</li><li><b>Laxo</b> (células): debajo de epitelios, lámina propia; nutrición y defensa.</li><li><b>Denso</b> (fibras): irregular (dermis) y regular (tendinoso, aponeurótico, corneal); elástico (ligamento nucal); sostén.</li><li><b>Mucoso</b> (sustancia amorfa): embrión, cordón umbilical, cresta del gallo, pulpa dentaria.</li></ul>`],
[2,"Describí las principales células propias del conectivo.",`<ul><li><b>Fibroblasto:</b> núcleo oval grande, cromatina laxa; RER y Golgi; sintetiza la matriz. Fibrocito: inactivo, núcleo denso.</li><li><b>Plasmocito:</b> núcleo excéntrico en rueda de carro, citoplasma basófilo con halo de Golgi; anticuerpos; deriva del linfocito B.</li><li><b>Mastocito:</b> gránulos metacromáticos (heparina, histamina, leucotrienos, PGD2, quimiotácticos); receptores IgE; alergia e inflamación.</li><li><b>Macrófago:</b> irregular, núcleo arriñonado, lisosomas; fagocitosis y presentación de antígenos; sistema mononuclear fagocítico.</li><li><b>Adipocitos:</b> unilocular (anillo de sello, reserva) y multilocular (grasa parda, calor).</li><li>Además: mesenquimática, reticular, pericito, endotelial.</li></ul>`],
[3,"Describí la fibra colágena: estructura, composición, síntesis y tipos.",`<ul><li>Fibras de ~10 µm, onduladas, rosas con H/E, azules con Masson; resisten la tracción.</li><li>Fibras → fibrillas (bandas de 68 nm) → moléculas de 300 × 1,5 nm, triple hélice de cadenas α ricas en glicina, prolina, hidroxiprolina, lisina, hidroxilisina.</li><li>Síntesis: preprocolágeno en ribosomas → hidroxilación, glucosilación y triple hélice en el RER → Golgi → exocitosis → corte de péptidos de extensión → tropocolágeno → ensamblado.</li><li>Tipos: I (hueso, tendón), II (cartílago), III (reticulares), IV (lámina basal), V, VI, VII (anclaje), XVIII.</li></ul>`],
[2,"Compará fibras colágenas, reticulares y elásticas.",`<ul><li><b>Colágenas:</b> colágeno I; haces gruesos; rosas con H/E; resistencia a la tracción.</li><li><b>Reticulares:</b> colágeno III; redes finas; argirófilas y PAS+; estroma de órganos linfáticos y lámina reticular.</li><li><b>Elásticas:</b> elastina + fibrilina; pálidas con H/E, orceína marrón rojizo; se estiran 150%; arterias, pulmón, ligamentos. Las sintetizan fibroblastos y músculo liso.</li></ul>`],
[3,"Describí la sustancia amorfa y sus funciones.",`<ul><li>No visible con H/E; levemente PAS+ y metacromática.</li><li><b>GAGs</b> (sulfatados y ácido hialurónico) con carga negativa que atraen Na+ y agua; <b>proteoglucanos</b> (GAGs + proteína central); <b>agrecanes</b> (proteoglucanos + ácido hialurónico); <b>glucoproteínas de adhesión</b> (fibronectina, laminina, tenascina, entactina, condronectina, osteonectina).</li><li>Funciones: difusión, resistencia a la compresión, migración celular, barrera a invasores, señalización.</li></ul>`],
[3,"Explicá el papel de las células del conectivo en la inflamación.",`<ul><li>Objetivo: destruir o debilitar al agente, limitar y reparar la lesión.</li><li>Macrófagos fijos: citoquinas (↑ permeabilidad). Mastocitos: histamina (vasodilatación) y factores que atraen leucocitos.</li><li>Neutrófilos: primeros; fagocitan; forman pus. Plasmocitos: anticuerpos. Eosinófilos: complejos antígeno-anticuerpo, acción antihistamínica reguladora. Macrófagos y monocitos: limpieza. Linfocitos al final.</li><li>Signos: dolor, rubor, calor, tumefacción, pérdida de función.</li></ul>`]
]

resumen:[
["Definición y nutrición", `<p>Derivado del conectivo, <b>mesodérmico</b>, con células (<b>condrocitos</b> en <b>lagunas</b>) y una matriz muy especializada que lo hace resistente y maleable. Funciones: <b>sostén y protección</b>; amortigua golpes y su superficie lisa permite el movimiento articular casi sin fricción.</p><ul><li><b>No tiene vasos, nervios ni linfáticos:</b> metabolismo bajo y reparación escasa.</li><li>Se nutre por <b>difusión</b> a través de la matriz desde los vasos del pericondrio; donde no hay pericondrio (superficies articulares), desde el <b>líquido sinovial</b>.</li></ul>`],
["Pericondrio", `<p>Vaina de conectivo <b>vascularizada</b> que cubre a la mayoría de los cartílagos: <b>capa fibrosa externa</b> (fibras colágenas, fibroblastos, vasos) y <b>capa interna</b> de células condrogénicas que secretan matriz. Falta en el cartílago articular y en el fibrocartílago.</p>`],
["Tres tipos de cartílago", `<div class="tw"><table><tr><th></th><th>Hialino</th><th>Elástico</th><th>Fibrocartílago</th></tr>
<tr><td>Matriz</td><td>Colágeno II (más IX, X, VI), agrecanes, adhesivas; 60–80% agua</td><td>Colágeno II + densa red de fibras elásticas ramificadas</td><td>Colágeno I (gruesas) + colágeno II</td></tr>
<tr><td>Células</td><td>Grupos isógenos</td><td>Más abundantes y grandes</td><td>Pocos, en hileras o grupos isógenos entre fibras; además fibroblastos</td></tr>
<tr><td>Pericondrio</td><td>Sí (salvo articular)</td><td>Sí, rico en fibras elásticas</td><td>No</td></tr>
<tr><td>Ubicación</td><td>Laringe, tráquea, bronquios, costillas-esternón, articulaciones, modelo óseo embrionario, placa epifisaria</td><td>Epiglotis, pabellón auricular</td><td>Discos intervertebrales, sínfisis púbica, inserciones de tendones</td></tr>
<tr><td>Propiedad</td><td>Vítreo, semitranslúcido, gris azulado; el más frecuente</td><td>Mucha flexibilidad</td><td>Resiste compresión y distensión intensas</td></tr></table></div>`],
["Células del cartílago", `<ul><li><b>Condrogénicas:</b> fusiformes, núcleo ovoide, poco citoplasma, Golgi pequeño, pocas mitocondrias, mucho RER y ribosomas libres. Se diferencian en condroblastos.</li><li><b>Condroblastos:</b> redondeados, basófilos, con organoides de síntesis proteica; forman la matriz.</li><li><b>Condrocitos:</b> condroblastos rodeados de matriz en lagunas; producen y mantienen la matriz y aún se dividen: forman <b>grupos isógenos</b> de 2 a 4 células (axiles, en fila, o coronarios).</li></ul>`],
["Matriz del cartílago hialino", `<p><b>Composición:</b> agua 60–80%; colágenos ~15% (80% tipo II; IX y XI ~15%; otros ~5%); agrecán ~9%; glucoproteínas multiadhesivas ~5%; células apenas 3–5%.</p><ul><li>El <b>colágeno II</b> forma una trama de sostén donde quedan los condrocitos.</li><li>Los <b>agrecanes</b> (proteoglucanos unidos a ácido hialurónico) llenan los espacios; sus cargas negativas atraen <b>Na+</b> y este atrae <b>agua</b>: maleabilidad, resistencia a la compresión y difusión de nutrientes.</li><li><b>Proteínas de adhesión:</b> fibronectina (fija condrocitos a la matriz) y <b>condronectina</b> (une colágeno II, condroitín-4 y -6-sulfato, ácido hialurónico e integrinas de condroblastos y condrocitos).</li></ul>
<p>La basofilia y metacromasia reflejan los proteoglucanos sulfatados. La matriz no se tiñe homogéneamente:</p><ul><li><b>Territorial</b> (alrededor de la laguna): pocas fibras, mucho condroitín sulfato → <b>basófila y PAS+ intensa</b>.</li><li><b>Interterritorial</b> (entre lagunas): muchas fibras, poco condroitín sulfato → <b>acidófila</b>.</li></ul>`],
["Histogénesis y crecimiento", `<ol><li>Células <b>mesenquimáticas</b> (prolongaciones, cromatina laxa) se agrupan; las del centro se redondean, pierden prolongaciones y forman <b>células condrogénicas</b> en <b>centros de condrificación</b>.</li><li>Con <b>baja tensión de O2</b> → condroblasto; con alta (zona vascularizada) → osteoblasto.</li><li>Los condroblastos secretan matriz, quedan atrapados en lagunas y pasan a condrocitos.</li><li>Las células de la periferia forman fibroblastos (pericondrio) y algunas condrogénicas quedan de reserva en su capa interna.</li></ol>
<ul><li><b>Crecimiento intersticial</b> (desde adentro): los condrocitos se dividen formando grupos isógenos; al secretar matriz se separan. Axiles (filas) en cartílagos de crecimiento; coronarios por divisiones en planos perpendiculares.</li><li><b>Crecimiento por yuxtaposición o aposición</b> (desde afuera): las condrogénicas de la capa interna del pericondrio se dividen y diferencian en condroblastos que agregan matriz en la periferia.</li></ul>`],
["Cartílago elástico y fibrocartílago al microscopio", `<p><b>Elástico:</b> matriz escasa con abundantes fibras elásticas finas y gruesas entre haces de colágeno II; condrocitos más numerosos y grandes. Se suele mostrar con H/E y orceína.</p><p><b>Fibrocartílago:</b> conectivo denso modelado + hialino. Núcleos <b>redondos</b> con poca matriz alrededor (condrocitos, en hileras o grupos isógenos) y núcleos <b>aplanados o alargados</b> en las zonas fibrosas (fibroblastos). Sin pericondrio. Con tricrómico de Gomori el colágeno se ve verde.</p>`]

[2,"Describí las células del cartílago y la matriz del hialino.",`<ul><li><b>Condrogénicas</b> (fusiformes, RER) → <b>condroblastos</b> (basófilos, sintetizan matriz) → <b>condrocitos</b> (en lagunas; mantienen la matriz; forman grupos isógenos axiles o coronarios).</li><li><b>Matriz:</b> 60–80% agua; colágeno II (más IX, X, VI); agrecanes que atraen Na+ y agua; fibronectina y condronectina.</li><li><b>Regiones:</b> territorial (basófila, PAS+, mucho condroitín sulfato) e interterritorial (acidófila, más fibras).</li></ul>`],
[3,"Explicá la histogénesis del cartílago y los dos tipos de crecimiento.",`<ul><li>Células mesenquimáticas se agrupan en centros de condrificación; las centrales se redondean → condrogénicas → condroblastos (baja tensión de O2) que secretan matriz y quedan como condrocitos. Las periféricas forman el pericondrio; quedan condrogénicas de reserva.</li><li><b>Intersticial:</b> división de condrocitos → grupos isógenos que se separan al secretar matriz; crece desde adentro.</li><li><b>Aposicional:</b> condrogénicas de la capa interna del pericondrio → condroblastos que agregan matriz en la periferia.</li></ul>`],
[2,"Compará los tres tipos de cartílago.",`<ul><li><b>Hialino:</b> colágeno II, agrecanes, 60–80% agua; pericondrio (salvo articular); tráquea, laringe, costillas, articulaciones, placa epifisaria.</li><li><b>Elástico:</b> colágeno II + red de fibras elásticas; condrocitos grandes y abundantes; pericondrio con fibras elásticas; epiglotis, oreja.</li><li><b>Fibrocartílago:</b> colágeno I y II; condrocitos en hileras o grupos isógenos entre fibras, con fibroblastos; sin pericondrio; discos intervertebrales, sínfisis, inserciones tendinosas.</li></ul>`]
