fuente:"Apunte «Tejidos animales: Tejido óseo» (2024)",
resumen:[
["Definición y funciones", `<p>Conectivo especializado con <b>matriz calcificada</b> que deja atrapadas a las células que la secretaron. A diferencia del cartílago, tiene <b>abundante vascularización e inervación</b>. Se caracteriza por su resistencia y dureza.</p><p>Funciones: sostén y protección (encéfalo, médula, pulmones, corazón), palancas que multiplican la fuerza muscular y reservorio de minerales. Aloja la <b>médula ósea</b> (órgano hematopoyético).</p>`],
["Organización del hueso", `<ul><li><b>Hueso compacto:</b> capa densa y ordenada.</li><li><b>Hueso esponjoso:</b> malla de espículas anastomosadas (trabéculas) con médula y vasos en los espacios.</li></ul><p><b>Hueso largo:</b> diáfisis (casi todo compacto), epífisis (mucho esponjoso con corteza fina; superficie articular de cartílago hialino), metáfisis (entre ambas, hasta la línea epifisaria) y cavidad medular. <b>Huesos cortos:</b> corteza compacta, interior esponjoso, superficies articulares con cartílago hialino y el resto con periostio.</p>`],
["Periostio, endostio y médula", `<ul><li><b>Periostio:</b> cubre el hueso salvo en las articulaciones. Capa <b>fibrosa externa</b> (conectivo denso; distribuye vasos y nervios) y capa <b>celular interna</b> con células osteoprogenitoras (poco definida si no hay formación ósea, pero ante estímulos se dividen y forman osteoblastos).</li><li><b>Fibras de Sharpey (perforantes):</b> colágeno del periostio que entra oblicuo o perpendicular al hueso y se continúa con la matriz; llegan a las laminillas circunferenciales externas e intersticiales, no a las osteonas.</li><li><b>Endostio:</b> una sola capa de células osteoprogenitoras (y osteoblastos) que reviste cavidades internas del compacto y del esponjoso.</li><li><b>Médula roja:</b> células sanguíneas en diferenciación + red de células y fibras reticulares. <b>Médula amarilla:</b> tejido adiposo; predomina en adultos.</li></ul>`],
["Técnicas de estudio", `<ul><li><b>Descalcificación:</b> solución ácida que quita las sales de calcio; permite ver células y componentes orgánicos. Desventaja: los osteocitos se deforman.</li><li><b>Desgaste:</b> lijar hasta una lámina fina; muestra la arquitectura dada por los componentes inorgánicos (osteonas, laminillas, lagunas, canalículos). Desventaja: se destruyen las células y lagunas y canalículos quedan con detritos.</li></ul>`],
["Matriz ósea", `<ul><li><b>Inorgánica (~65% del peso seco):</b> calcio y fósforo como <b>cristales de hidroxiapatita</b> (40 × 25 × 2 nm) ordenados a lo largo de las fibras de colágeno I; una cubierta de hidratación permite el intercambio de iones.</li><li><b>Orgánica (~35%):</b> colágeno I (≈90% de lo orgánico; fibras de 50–70 nm), sustancia básica con proteoglucanos (condroitín y queratán sulfato), agrecanes y proteínas de adhesión como la <b>osteonectina</b> (une colágeno e hidroxiapatita).</li><li>La dureza viene de la relación cristales-colágeno. Si se quita el mineral: conserva la forma pero queda <b>flexible</b>. Si se quita lo orgánico: conserva la forma pero queda <b>muy frágil</b>.</li></ul>`],
["Células óseas", `<div class="tw"><table><tr><th>Célula</th><th>Origen</th><th>Morfología y ubicación</th><th>Función</th></tr>
<tr><td>Osteoprogenitora</td><td>Mesenquimática (alta tensión de O2 → osteoblasto; baja → condroblasto)</td><td>Fusiforme, núcleo oval pálido, poco RER y muchos ribosomas libres; periostio interno, endostio, conductos de Havers</td><td>Máxima actividad en crecimiento intenso</td></tr>
<tr><td>Osteoblasto</td><td>Osteoprogenitora</td><td>Cúbico o poliédrico, en monocapa sobre la superficie donde se forma hueso; prolongaciones con uniones de nexo</td><td>Secreta el <b>osteoide</b>: colágeno I, osteocalcina, osteonectina, osteopontina, proteoglucanos y fosfatasa alcalina. FA y osteocalcina en sangre = marcadores clínicos</td></tr>
<tr><td>Osteocito</td><td>Osteoblasto atrapado</td><td>En lagunas; prolongaciones en canalículos unidas por nexos; núcleo aplanado, poco RER y Golgi</td><td>Mantiene el hueso; intercambio por canalículos</td></tr>
<tr><td>Osteoclasto</td><td>Línea distinta: progenitores hematopoyéticos de la médula (granulocitos/monocitos)</td><td>Gigante (~150 µm), hasta 50 núcleos, acidófilo; en <b>lagunas de Howship</b>; receptores para su factor estimulante y para calcitonina</td><td>Resorción y remodelación</td></tr></table></div>
<p><b>Compartimientos del osteoclasto activo:</b> basal (núcleos, Golgi, mitocondrias, RER: produce enzimas), vesicular (vesículas de ida y vuelta), <b>zona clara</b> (sin organoides, con actina que ayuda a las integrinas a sellar contra el hueso: zona de sellado) y <b>borde rugoso</b> (pliegues que exocitan enzimas y protones y endocitan productos; mira al compartimiento subosteoclástico).</p>`],
["Mecanismo de resorción", `<ol><li>La <b>anhidrasa carbónica</b> forma ácido carbónico: CO2 + H2O → H2CO3 → H+ + HCO3−.</li><li>El bicarbonato sale con Na+ hacia los capilares.</li><li><b>Bombas de protones</b> del borde rugoso llevan H+ al compartimiento subosteoclástico (el Cl− los sigue): baja el pH y se <b>disuelve el mineral</b>.</li><li><b>Hidrolasas lisosomales y colagenasa</b> digieren la parte orgánica ya descalcificada.</li><li>Los productos entran por endocitosis, se degradan (aminoácidos, mono y disacáridos) y pasan a los capilares.</li></ol>`],
["Hueso primario, secundario y sistemas laminillares", `<ul><li><b>Primario (inmaduro, entretejido):</b> el primero en formarse (feto y reparación); colágeno irregular, más osteocitos, menos mineral. Persiste en huesos del cráneo e inserciones tendinosas.</li><li><b>Secundario (maduro, laminar):</b> laminillas paralelas o concéntricas con colágeno paralelo dentro de cada una; más mineralizado y resistente; canalículos que conectan lagunas.</li></ul>
<p><b>Sistemas laminillares del compacto</b> (bien visibles en la diáfisis):</p><ol><li><b>Circunferenciales externas:</b> bajo el periostio; con fibras de Sharpey.</li><li><b>Circunferenciales internas:</b> rodean la cavidad medular; menos extensas.</li><li><b>Osteonas (sistemas de Havers):</b> laminillas concéntricas alrededor del <b>conducto de Havers</b> (vasos y nervios), canalículos radiales.</li><li><b>Intersticiales:</b> restos de osteonas resorbidas en la remodelación.</li></ol><p><b>Conductos de Volkmann (perforantes):</b> llevan vasos y nervios desde periostio y endostio a los de Havers y los conectan entre sí.</p>`],
["Osificación intramembranosa", `<p>En un mesénquima ricamente vascularizado: células mesenquimáticas → osteoprogenitoras → osteoblastos que secretan matriz formando <b>espículas y trabéculas</b> (centro primario de osificación), con colágeno al azar (hueso primario). El osteoide se calcifica rápido; los osteoblastos atrapados son osteocitos y sus prolongaciones dejan canalículos. El conectivo vascular entre trabéculas se vuelve médula ósea; el mesénquima no calcificado forma periostio y endostio. Da hueso esponjoso; típica de <b>huesos planos del cráneo</b>.</p>`],
["Osificación endocondral", `<p>Dos etapas: se forma un <b>modelo de cartílago hialino</b> en miniatura que crece (intersticial y aposicional), y luego sirve de andamio y es reemplazado por hueso. Así se forman los <b>huesos largos y cortos</b>.</p><ol><li>Los condrocitos del centro se <b>hipertrofian</b> (glucógeno, vacuolas), sus lagunas crecen y los tabiques de matriz se <b>calcifican</b>.</li><li>Se vasculariza el pericondrio en la mitad de la diáfisis: las condrogénicas pasan a osteoprogenitoras (alta O2), el pericondrio se vuelve <b>periostio</b> y los osteoblastos forman el <b>collar (manguito) óseo subperióstico</b>.</li><li>El collar impide la difusión: mueren los condrocitos hipertróficos y quedan lagunas confluentes (futura cavidad medular).</li><li>Por orificios hechos por osteoclastos entra la <b>yema perióstica</b> (osteoprogenitoras, hematopoyéticas y vasos).</li><li>Los osteoblastos depositan osteoide sobre el cartílago calcificado: complejo cartílago-hueso calcificado. Los osteoclastos lo resorben y agrandan la cavidad; el cartílago de la diáfisis se reemplaza, salvo las placas epifisarias.</li><li><b>Centros secundarios</b> en las epífisis: igual pero <b>sin collar óseo</b>; persisten el cartílago articular (toda la vida) y la placa epifisaria.</li></ol>`],
["Placa epifisaria y crecimiento", `<p><b>Zonas desde el lado epifisario:</b></p><ol><li><b>Reserva o reposo:</b> condrocitos al azar, mitóticamente activos.</li><li><b>Proliferación:</b> grupos isógenos axiles (pilas de monedas).</li><li><b>Hipertrofia:</b> condrocitos aumentan de volumen.</li><li><b>Cartílago calcificado:</b> las células degeneran, la matriz se calcifica y sirve de armazón; las más proximales sufren apoptosis (zona de erosión).</li><li><b>Osificación:</b> osteoblastos depositan matriz y pasan a osteocitos.</li></ol><p><b>Trabéculas:</b> directrices (solo cartílago calcificado), osteoides primarias (cartílago calcificado + osteoblastos), osteoides secundarias (eje de cartílago + osteoide + osteocitos + osteoblastos) y terciarias u óseas (sin cartílago, las más grandes).</p><p><b>Crecimiento en ancho:</b> aposicional desde la capa osteogénica del periostio, acompañado de resorción osteoclástica interna que agranda la cavidad medular.</p>`],
["Calcificación", `<ol><li>Ocurre en <b>nidos de calcificación</b>: sitios con proteínas que fijan Ca2+ (osteocalcina y otras sialoproteínas).</li><li>La alta concentración de Ca2+ induce a los osteoblastos a secretar <b>fosfatasa alcalina</b>, que aumenta el fosfato local.</li><li>Los osteoblastos liberan <b>vesículas matriciales</b> que acumulan Ca2+ y escinden fosfato.</li><li>Con FA y pirofosfatasa se cristaliza el fosfato cálcico como <b>hidroxiapatita</b>; los cristales crecen y se unen: una onda de mineralización recorre el osteoide, entre las fibras de colágeno y sobre ellas.</li></ol>`]
],

[1,"Definí tejido óseo, sus funciones y describí periostio y endostio.",`<ul><li>Conectivo especializado con matriz calcificada que atrapa a sus células; muy vascularizado e inervado; duro y resistente.</li><li>Funciones: sostén, protección, palancas, reserva mineral, aloja médula ósea.</li><li><b>Periostio:</b> capa fibrosa externa (vasos, nervios; fibras de Sharpey) y capa interna osteoprogenitora; falta en las articulaciones.</li><li><b>Endostio:</b> monocapa de osteoprogenitoras y osteoblastos que reviste cavidades internas.</li></ul>`],
[2,"Describí la matriz ósea.",`<ul><li><b>Inorgánica (~65%):</b> hidroxiapatita de Ca y P ordenada sobre el colágeno, con capa de hidratación para intercambio iónico.</li><li><b>Orgánica (~35%):</b> colágeno I (~90%), proteoglucanos (condroitín y queratán sulfato), agrecanes, osteonectina; además osteocalcina y osteopontina secretadas por el osteoblasto.</li><li>La relación cristal-colágeno da dureza y resistencia: sin mineral, flexible; sin orgánico, frágil.</li></ul>`],
[2,"Describí las cuatro células óseas.",`<ul><li><b>Osteoprogenitoras:</b> mesenquimáticas; fusiformes; periostio interno, endostio, Havers; alta O2 → osteoblasto.</li><li><b>Osteoblastos:</b> cúbicos en monocapa; secretan osteoide (colágeno I, osteocalcina, osteonectina, osteopontina, FA); nexos entre sí.</li><li><b>Osteocitos:</b> en lagunas; prolongaciones en canalículos con nexos; mantienen el hueso.</li><li><b>Osteoclastos:</b> origen hematopoyético; gigantes multinucleados acidófilos en lagunas de Howship; receptores para calcitonina; resorción.</li></ul>`],
[3,"Explicá la resorción ósea y los compartimientos del osteoclasto.",`<ul><li><b>Compartimientos:</b> basal (núcleos, Golgi, RER), vesicular, zona clara (sellado con actina e integrinas) y borde rugoso.</li><li>Anhidrasa carbónica: CO2 + H2O → H2CO3 → H+ + HCO3−; HCO3− sale con Na+ a los capilares.</li><li>Bombas de protones del borde rugoso acidifican el compartimiento subosteoclástico (Cl− acompaña) y disuelven el mineral.</li><li>Hidrolasas lisosomales y colagenasa degradan lo orgánico; endocitosis y descarga a capilares.</li></ul>`],
[3,"Describí la organización del hueso compacto.",`<ul><li>Hueso secundario (laminar).</li><li><b>Laminillas circunferenciales externas</b> (con fibras de Sharpey) e <b>internas</b> (alrededor de la cavidad medular).</li><li><b>Osteonas:</b> laminillas concéntricas alrededor del conducto de Havers (vasos y nervios); osteocitos en lagunas con canalículos radiales.</li><li><b>Laminillas intersticiales:</b> restos de osteonas remodeladas.</li><li><b>Conductos de Volkmann:</b> comunican Havers con periostio, endostio y entre sí.</li></ul>`],
[3,"Explicá la osificación intramembranosa y la endocondral, con la placa epifisaria y el crecimiento en ancho.",`<ul><li><b>Intramembranosa:</b> mesénquima → osteoblastos → trabéculas (centro primario); calcificación; osteocitos; médula entre trabéculas; periostio y endostio. Huesos planos del cráneo.</li><li><b>Endocondral:</b> modelo de cartílago hialino; hipertrofia y calcificación; pericondrio → periostio; collar óseo; muerte de condrocitos; yema perióstica; osteoblastos sobre cartílago calcificado; resorción y cavidad medular. Centros secundarios epifisarios sin collar.</li><li><b>Placa epifisaria:</b> reserva, proliferación, hipertrofia, cartílago calcificado, osificación (trabéculas directrices, primarias, secundarias y terciarias).</li><li><b>Ancho:</b> aposición subperióstica + resorción interna.</li></ul>`],
[3,"Explicá la calcificación del hueso.",`<ol><li>Nidos de calcificación: osteocalcina y sialoproteínas fijan Ca2+.</li><li>Los osteoblastos secretan fosfatasa alcalina: aumenta el fosfato.</li><li>Liberan vesículas matriciales que acumulan Ca2+ y fosfato.</li><li>Con FA y pirofosfatasa se forman cristales de hidroxiapatita que crecen y se unen: onda de mineralización en el osteoide, entre y sobre las fibras colágenas.</li></ol>`]
]

id:"muscular", nombre:"Tejido muscular",
fuente:"Apunte «Tejidos animales: Tejido muscular» (2023/24)",
resumen:[
["Generalidades", `<p>Su propiedad es la <b>contractilidad</b>, gracias a filamentos contráctiles bien dispuestos, la capacidad de degradar ATP y una membrana excitable. Responsable de la movilidad interna (vísceras, vasos, bombeo, peristalsis) y externa.</p><ul><li>Células alargadas llamadas <b>fibras musculares</b> (no confundir con las fibras del conectivo, que son productos de secreción).</li><li>Fuertemente unidas, en un estroma de conectivo con vasos y nervios, dispuestas en láminas o haces paralelos.</li><li>Rodeadas por membrana (lámina) basal.</li><li>Glucógeno como reserva y <b>mioglobina</b> (pigmento rojo que guarda O2).</li><li>Origen: <b>mesodermo</b>.</li></ul><p>Nomenclatura: <b>sarcolema</b> (membrana), <b>sarcoplasma</b> (citoplasma sin miofibrillas), <b>retículo sarcoplasmático</b> (REL), <b>sarcosomas</b> (mitocondrias). «Sarco» = carne.</p>`],
["Tres tipos de músculo", `<div class="tw"><table><tr><th></th><th>Esquelético (MEE)</th><th>Cardíaco (MEC)</th><th>Liso (ML)</th></tr>
<tr><td>Estrías</td><td>Sí</td><td>Sí (menos marcadas)</td><td>No</td></tr>
<tr><td>Célula</td><td>Cilíndrica, larga (1–40 mm × 10–100 µm)</td><td>Cilíndrica ramificada (~90 × 15 µm)</td><td>Fusiforme (2 × 15 µm a 10 × 500 µm)</td></tr>
<tr><td>Núcleos</td><td>Muchos, periféricos</td><td>Uno (rara vez dos), central, con halo claro</td><td>Uno, central</td></tr>
<tr><td>Uniones</td><td>—</td><td>Discos intercalares</td><td>Nexos (en el unitario)</td></tr>
<tr><td>Sistema T</td><td>Tríada (unión A-I)</td><td>Díada (línea Z)</td><td>Cavéolas + REL</td></tr>
<tr><td>Control</td><td>Voluntario (somático) y reflejo</td><td>Involuntario, espontáneo; SNA regula frecuencia</td><td>Involuntario (SNA)</td></tr>
<tr><td>Regulación del Ca2+</td><td>Troponina (en la actina)</td><td>Troponina; Ca2+ del RS y del exterior</td><td>Calmodulina-MLCK (en la miosina)</td></tr>
<tr><td>Regeneración</td><td>Células satélite</td><td>Casi nula (cicatriz)</td><td>Buena: división o pericitos</td></tr></table></div>`],
["Músculo esquelético al MO", `<p>Forma la «carne»; con tendones, huesos y articulaciones constituye el aparato locomotor: movimiento y postura; contracción rápida, vigorosa y voluntaria (también reflejos, como el rotuliano). Hay músculos esqueléticos viscerales: faringe, esófago superior, lengua, porción lumbar del diafragma (deglución, fonación, respiración).</p><ul><li>Fibra cilíndrica, <b>multinucleada con núcleos periféricos</b> ovales, cromatina laxa, 1–2 nucléolos.</li><li><b>Células satélite:</b> mioblastos persistentes de núcleo más denso, entre sarcolema y lámina externa.</li><li>Muy <b>acidófila</b>; fibras paralelas con capilares continuos entre ellas.</li><li>Estriaciones transversales y longitudinales por las <b>miofibrillas</b> (1–2 µm) que ocupan casi todo el citoplasma.</li></ul>`],
["El sarcómero", `<ul><li><b>Banda A:</b> oscura, <b>anisótropa</b>. <b>Banda I:</b> clara, <b>isótropa</b>.</li><li><b>Línea Z:</b> en el centro de la banda I. <b>Banda H:</b> zona pálida central de la A. <b>Línea M:</b> en el centro de la H.</li><li><b>Sarcómero:</b> entre dos líneas Z sucesivas = banda A + dos hemibandas I. <b>Unidad contráctil</b>. Los sarcómeros de todas las miofibrillas están en registro.</li><li>Banda I: solo filamentos <b>finos</b>. Banda A: <b>gruesos</b> + finos interdigitados. Banda H: solo <b>gruesos</b>. Línea M: enlaces entre gruesos vecinos. Disco Z: entramado zigzagueante de proteínas que ancla la actina.</li><li>Donde se superponen, cada grueso está rodeado por <b>6 finos</b> (disposición hexagonal).</li></ul>`],
["El músculo como órgano", `<p>Cuerpo rojo, blando y contráctil + tendón o aponeurosis blanco, firme y no contráctil. El conectivo une fibras y lleva vasos y nervios:</p><ul><li><b>Endomisio:</b> rodea cada fibra; fibras reticulares y lámina basal; capilares y filetes nerviosos finos.</li><li><b>Perimisio:</b> conectivo denso que agrupa fibras en <b>fascículos</b>; vasos y nervios mayores.</li><li><b>Epimisio:</b> denso regular que envuelve todo el músculo (aponeurosis); por él entran vasos y nervios.</li></ul><p>Irrigación: arteriolas entran por el perimisio; capilares paralelos a las fibras, anastomosados. Linfáticos solo en epimisio y perimisio.</p>`],
["Ultraestructura del músculo esquelético", `<ul><li><b>Túbulos T:</b> invaginaciones del sarcolema a nivel de la <b>unión de las bandas A e I</b>; llevan la despolarización al interior.</li><li><b>Retículo sarcoplasmático:</b> REL que almacena Ca2+; cisternas terminales a cada lado del túbulo T y túbulos longitudinales alrededor de cada miofibrilla.</li><li><b>Tríada:</b> túbulo T + dos cisternas terminales.</li><li>Citoesqueleto de <b>desmina y vimentina</b> entre miofibrillas.</li><li>Muchas mitocondrias, Golgi poco desarrollado junto a los núcleos, <b>mioglobina</b>.</li></ul>`],
["Filamentos finos y gruesos", `<p><b>Finos:</b></p><ul><li><b>Actina F:</b> dos cadenas en espiral de actina G (cada una con sitio de unión para miosina).</li><li><b>Tropomiosina:</b> dos cadenas en espiral en el surco de la actina F; <b>bloquea</b> la unión actina-miosina. Cada una cubre <b>7 actinas G</b> y lleva una troponina.</li><li><b>Troponina:</b> <b>TnT</b> (une tropomiosina), <b>TnC</b> (une Ca2+), <b>TnI</b> (une actina).</li></ul><p><b>Gruesos:</b> 200–300 moléculas de <b>miosina II</b> (2 cadenas pesadas + 4 livianas; cola o bastón helicoidal y dos cabezas globulares, cada una con 2 livianas). La miosina I tiene una cabeza (células no musculares).</p><ul><li><b>Tripsina:</b> meromiosina liviana (MML, casi todo el bastón) y pesada (MMP, cabezas + parte del bastón: «palo de golf»).</li><li><b>Papaína sobre MMP:</b> <b>S1</b> (cabezas: ATPasa y sitio de unión a actina, la parte más importante) y <b>S2</b> (fibrilar).</li><li>«Bisagra» entre MML y MMP y cabeza móvil: forman <b>puentes transversales</b>.</li><li>Colas superpuestas y paralelas; cabezas hacia los extremos, opuestas a la línea M; las dos mitades son inversas. La banda H es la zona de colas.</li></ul>`],
["Proteínas accesorias", `<ul><li><b>Titina:</b> red elástica que ancla los gruesos a la línea Z y evita la sobredistensión.</li><li><b>α-actinina:</b> organiza los finos en paralelo y los ancla a la línea Z.</li><li><b>Nebulina:</b> inelástica, paralela a los finos; ayuda a la α-actinina a anclarlos.</li><li><b>Miomesina:</b> enlaces entre gruesos en la línea M.</li><li><b>Proteína C:</b> fija gruesos en la línea M.</li><li><b>Tropomodulina:</b> casquete en el extremo libre del fino; regula su longitud.</li><li><b>Distrofina:</b> une actina a la laminina de la lámina basal.</li></ul>`],
["Contracción y relajación", `<p><b>Teoría del deslizamiento (Huxley):</b> los finos se deslizan sobre los gruesos; el sarcómero se acorta pero los filamentos no. Se acortan las bandas I y H; la A no cambia. Se contraen todos los sarcómeros de la fibra (<b>ley del todo o nada</b>); la fuerza del músculo depende de cuántas fibras se contraen. En reposo, la cabeza de miosina ya hidrolizó ATP y está «cargada» a 90°, pero el sitio de la actina está tapado por troponina-tropomiosina.</p><ol><li>Impulso → placa motora → <b>acetilcolina</b> → despolarización del sarcolema.</li><li>El potencial se propaga por el sarcolema y los <b>túbulos T</b>.</li><li>Por puentes con las cisternas terminales se abren canales y sale <b>Ca2+</b> al citosol.</li><li>El Ca2+ se une a <b>TnC</b> y cambia su configuración.</li><li>La <b>tropomiosina</b> se hunde en el surco y descubre los sitios de la actina.</li><li>La miosina se une a la actina, libera ADP + P y pasa de 90° a 45°: <b>golpe de fuerza</b>; la actina avanza ~10 nm hacia la banda H.</li><li>Queda libre el sitio de ATP y se une un ATP.</li><li>Esto separa la miosina de la actina.</li><li>Se hidroliza el ATP y la cabeza vuelve a 90°: el ciclo se repite.</li><li><b>Relajación:</b> sin estímulo, el Ca2+ vuelve al retículo y se une a <b>calsecuestrina</b>; TnC pierde Ca2+ y la tropomiosina vuelve a bloquear.</li></ol>`],
["Energía y tipos de fibras", `<p>Reservas: <b>ATP</b> y <b>fosfato de creatina</b>. El ATP se fabrica en reposo por glucólisis y fosforilación oxidativa; en contracción prolongada el ADP se refosforila por glucólisis anaerobia y por la fosfocreatinquinasa.</p><div class="tw"><table><tr><th></th><th>Rojas</th><th>Blancas</th><th>Intermedias</th></tr><tr><td>Tamaño</td><td>Pequeñas</td><td>Grandes</td><td>Intermedio</td></tr><tr><td>Mioglobina, citocromos, mitocondrias</td><td>Muchos</td><td>Pocos</td><td>Intermedios</td></tr><tr><td>Vascularización</td><td>Abundante</td><td>Escasa</td><td>—</td></tr><tr><td>Energía</td><td>Fosforilación oxidativa</td><td>Glucólisis anaeróbica</td><td>Oxidativa</td></tr><tr><td>Contracción</td><td>Lenta, repetitiva, poco fatigable</td><td>Rápida, intermitente, fatigable (ácido láctico)</td><td>—</td></tr><tr><td>Ejemplo</td><td>Patas del ñandú, pectoral de aves migratorias</td><td>Pectoral de pavo y gallina</td><td>—</td></tr></table></div>`],
["Inervación del músculo esquelético", `<p>Recibe fibras <b>motoras</b> (contracción) y <b>sensitivas</b> (tensión y posición).</p><ul><li><b>Placa motora:</b> el axón pierde la mielina (no las células de Schwann) y se aloja en una depresión de la fibra; terminal con mitocondrias y vesículas de <b>acetilcolina</b>; hendidura sináptica. La ACh se une a receptores del sarcolema → entra Na+ → potencial de acción. La <b>colinesterasa</b> de la lámina externa hidroliza el exceso de ACh.</li><li><b>Unidad motora:</b> una motoneurona + sus fibras. Movimientos finos = unidades chicas (extrínsecos del ojo: ~3 fibras por neurona); pared abdominal: hasta ~1000.</li><li><b>Huso muscular:</b> receptor encapsulado de estiramiento; 8–15 <b>fibras intrafusales</b> (de bolsa nuclear y de cadena nuclear); terminaciones <b>anuloespirales</b> (primarias, adaptación rápida) y <b>en ramo de flores</b> (secundarias, lenta). Al estirarse provoca <b>contracción refleja</b> que previene desgarros. Las fibras comunes son extrafusales.</li><li><b>Órgano tendinoso de Golgi:</b> en el tendón; responde al estiramiento <b>inhibiendo</b> motoneuronas: relaja el músculo (lo opuesto al huso).</li></ul><p><b>Regeneración:</b> por <b>células satélite</b> (se dividen y forman mioblastos) si la lámina externa está íntegra; si se rompe, cicatriz de conectivo denso.</p>`],
["Músculo cardíaco", `<p>Miocardio y túnica media de la desembocadura de las grandes venas. Mismos sarcómeros que el esquelético pero contracción <b>espontánea, rítmica e involuntaria</b> (sístole seguida de diástole, no tetánica). Origen: hoja esplácnica del mesodermo lateral; células aisladas que se diferencian, <b>sin fusión</b>.</p><ul><li><b>MO:</b> células cilíndricas ramificadas y anastomosadas; núcleo central (rara vez dos) con <b>halo perinuclear claro</b>; ~90 × 15 µm; muy acidófilo; estrías menos marcadas; <b>discos intercalares</b> (bandas escaleriformes); sin células satélite; conectivo escaso muy vascularizado.</li><li><b>MET:</b> túbulos T más anchos a nivel de las <b>líneas Z</b>; retículo menos organizado: <b>díada</b>; una masa fibrilar continua (se habla de una sola miofibrilla por célula); mitocondrias grandes y abundantes; halo con Golgi rudimentario, mitocondrias, lipofucsina y glucógeno; mucha mioglobina.</li><li><b>Disco intercalar:</b> componente <b>transversal</b> (zonula adherens que ancla actina, como un disco Z, y desmosomas) y <b>lateral</b> (uniones de nexo: acoplamiento eléctrico, sincitio funcional).</li><li><b>Histofisiología:</b> células de conducción cardíaca (nódulos y fibras) inician y coordinan. El SNA solo regula la frecuencia: simpático acelera, parasimpático enlentece. Ca2+ del retículo y del exterior.</li><li><b>Regeneración:</b> prácticamente nula; un infarto se reemplaza por conectivo (divisiones muy raras, ~0,1%).</li></ul>`],
["Músculo liso", `<p>En casi todas las vísceras y vasos, piel y ojo: contracción lenta y sostenida, no sujeta a la ley del todo o nada.</p><ul><li><b>MO:</b> células fusiformes con un núcleo central redondeado (en la parte más ancha); citoplasma levemente acidófilo, sin estrías transversales. Aisladas, en haces (erector del pelo) o en láminas; fibras desplazadas (extremo fino junto a la parte ancha de la vecina).</li><li><b>MET:</b> lámina externa propia; alrededor del núcleo mitocondrias, RER, Golgi y glucógeno; muchos finos, menos gruesos, filamentos intermedios de desmina y vimentina; sin sarcómeros, trama tridimensional.</li><li><b>Cuerpos densos</b> (con α-actinina): anclan finos e intermedios; equivalen a las líneas Z.</li><li><b>Cavéolas</b> con canales y bombas de Ca2+ + REL: equivalen al sistema T.</li></ul><p><b>Contracción:</b> más lenta, mayor acortamiento y más duradera. La miosina tiene cabezas en toda su extensión salvo los extremos. Ca2+ extra e intracelular → <b>calmodulina</b> → <b>quinasa de cadenas livianas de miosina</b> fosforila la miosina → interacción con actina. Regulación asociada a la <b>miosina</b>. Solo se contrae la periferia (la desmina central protege núcleo y organoides). <b>Tono:</b> la miosina defosforilada unida a actina pierde actividad ATPasa y no se suelta: contracción prolongada con poco ATP.</p><ul><li><b>Unitario o visceral:</b> una fibra nerviosa para varias células; nexos; contracción coordinada (peristaltismo, vejiga, útero).</li><li><b>Multiunitario:</b> una terminación por célula, sin nexos; control fino (iris, arteriolas).</li></ul><p><b>Crecimiento:</b> hipertrofia e hiperplasia (preñez, megacolon); regeneración por división o, preferentemente, a partir de <b>pericitos</b>.</p>`]
],

[1,"Mioglobina","Pigmento rojo análogo a la hemoglobina que fija O2 y lo facilita a las mitocondrias."],

[2,"Titina","Red elástica que ancla los gruesos a la línea Z y evita la distensión excesiva."],
[2,"α-actinina y nebulina","α-actinina: ancla los finos a la línea Z. Nebulina: inelástica, paralela a los finos, ayuda a anclarlos."],
[3,"Miomesina, proteína C, tropomodulina y distrofina","Miomesina y proteína C: gruesos en la línea M. Tropomodulina: casquete del fino, regula su longitud. Distrofina: une actina a la laminina."],
[2,"Teoría de Huxley","Deslizamiento de los finos sobre los gruesos: el sarcómero se acorta pero los filamentos no."],
[2,"¿Qué se acorta y qué no en la contracción?","Se acortan el sarcómero y las bandas I y H; la banda A no cambia."],
[3,"Contracción: pasos 1 a 5","ACh en la placa motora → despolarización → túbulo T → salida de Ca2+ de las cisternas terminales → Ca2+ se une a TnC → la tropomiosina descubre los sitios de la actina."],
[3,"Contracción: pasos 6 a 9","Miosina (cargada a 90°) se une a actina, libera ADP + P y pasa a 45° (golpe de fuerza) → se une ATP → se separa → hidroliza ATP y vuelve a 90°."],

[2,"Fibras blancas","Grandes, poca mioglobina y mitocondrias, poco irrigadas; glucólisis anaerobia; rápidas, intermitentes, fatigables. Pectoral de pavo y gallina."],

[2,"Unidad motora","Una motoneurona + las fibras que inerva. Ojo: ~3 fibras por neurona; pared abdominal: hasta ~1000."],
[3,"Huso muscular","Receptor de estiramiento: 8–15 fibras intrafusales (bolsa nuclear y cadena nuclear); terminaciones anuloespirales (primarias, rápidas) y en ramo de flores (secundarias, lentas). Provoca contracción refleja."],

[2,"Regeneración del músculo esquelético","Por células satélite si la lámina externa está íntegra; si no, cicatriz de conectivo denso."],
[1,"Músculo cardíaco al MO","Fibras ramificadas y anastomosadas, núcleo central con halo claro, estrías menos marcadas, discos intercalares; sin células satélite."],
[2,"Origen de las células cardíacas","Hoja esplácnica del mesodermo lateral; diferenciación de células aisladas, sin fusión."],
[2,"Díada","En el cardíaco: túbulo T (más ancho, a nivel de la línea Z) + una pequeña dilatación del retículo."],
[3,"Componentes del disco intercalar","Transversal: zonula adherens (ancla actina, equivale a un disco Z) y desmosomas. Lateral: uniones de nexo (acoplamiento eléctrico)."],
[2,"Control de la contracción cardíaca","Rítmica y espontánea, por células de conducción (nódulos y fibras). El SNA regula la frecuencia: simpático acelera, parasimpático enlentece."],
[2,"Regeneración cardíaca","Casi nula (sin células satélite): un infarto se reemplaza por conectivo."],
[1,"Fibra muscular lisa al MO","Fusiforme, un núcleo central, citoplasma levemente acidófilo, sin estrías transversales."],
[2,"Cuerpos densos","Contienen α-actinina; anclan finos e intermedios al sarcolema y en el citoplasma. Equivalen a las líneas Z."],
[2,"Cavéolas","Invaginaciones en forma de botella con canales y bombas de Ca2+; con el REL equivalen al sistema T."],
[3,"Regulación de la contracción del músculo liso","Ca2+ → calmodulina → quinasa de cadenas livianas de miosina → fosforila la miosina → interacción con actina. Regulación asociada a la miosina."],
[3,"Miosina del músculo liso vs estriado","Liso: cabezas en toda la extensión salvo los extremos (más acortamiento). Estriado: zona central lisa y cabezas en los extremos."],
[3,"Tono del músculo liso","La miosina defosforilada unida a actina pierde actividad ATPasa y no se suelta: contracción prolongada con poco ATP."],
[2,"Músculo liso unitario vs multiunitario","Unitario: una fibra nerviosa para varias células, nexos, contracción coordinada (intestino, vejiga, útero). Multiunitario: una terminación por célula, sin nexos (iris, arteriolas)."],
[2,"Crecimiento y regeneración del músculo liso","Hipertrofia e hiperplasia (preñez, megacolon). Regenera por división o, preferentemente, desde pericitos."]

dev:[
[1,"Enumerá las características generales del tejido muscular y compará los tres tipos.",`<ul><li>Contractilidad; células alargadas (fibras) muy unidas, con lámina basal, glucógeno y mioglobina; estroma conectivo; origen mesodérmico.</li><li><b>Esquelético:</b> estriado, multinucleado periférico, voluntario, tríadas, células satélite.</li><li><b>Cardíaco:</b> estriado, ramificado, núcleo central con halo, discos intercalares, díadas, involuntario y espontáneo, sin regeneración.</li><li><b>Liso:</b> fusiforme, núcleo central, sin estrías, cuerpos densos y cavéolas, involuntario, regulación por calmodulina-MLCK, regenera desde pericitos.</li></ul>`],
[2,"Describí la fibra esquelética al MO, el sarcómero y la organización del músculo.",`<ul><li>Fibra cilíndrica larga, multinucleada con núcleos periféricos, acidófila, estrías transversales y longitudinales; miofibrillas; células satélite.</li><li><b>Sarcómero:</b> entre líneas Z; banda A (anisótropa, gruesos + finos) con banda H (solo gruesos) y línea M; hemibandas I (isótropas, solo finos) con la línea Z en el centro.</li><li><b>Envolturas:</b> endomisio (cada fibra), perimisio (fascículos), epimisio (músculo entero).</li></ul>`],
[3,"Describí la estructura molecular de los filamentos y las proteínas accesorias.",`<ul><li><b>Finos:</b> actina F (dos cadenas de actina G), tropomiosina (en el surco, cubre 7 actinas G, bloquea) y troponina (TnT, TnC, TnI).</li><li><b>Gruesos:</b> 200–300 miosinas II (2 pesadas + 4 livianas); MML y MMP por tripsina; S1 (ATPasa + unión a actina) y S2 por papaína; colas al centro y cabezas hacia los extremos.</li><li><b>Accesorias:</b> titina, α-actinina, nebulina, miomesina, proteína C, tropomodulina, distrofina.</li></ul>`],
[3,"Explicá el mecanismo de contracción y relajación del músculo esquelético.",`<ol><li>Impulso → ACh en la placa motora → despolarización.</li><li>Propagación por sarcolema y túbulos T.</li><li>Apertura de canales de Ca2+ de las cisternas terminales.</li><li>Ca2+ se une a TnC.</li><li>Tropomiosina se corre y descubre la actina.</li><li>Miosina (a 90°) se une, libera ADP + P y pasa a 45°: golpe de fuerza (~10 nm hacia la H).</li><li>Se une ATP → se suelta → hidrólisis → vuelve a 90°. Muchos ciclos.</li><li>Relajación: Ca2+ al retículo (calsecuestrina), TnC sin Ca2+, tropomiosina bloquea.</li></ol><p>Teoría de Huxley: los filamentos no se acortan; se acortan I y H; la A no cambia.</p>`],
[3,"Describí la inervación del músculo esquelético.",`<ul><li><b>Placa motora:</b> axón sin mielina con Schwann; vesículas de ACh; hendidura; receptores en el sarcolema; colinesterasa en la lámina externa.</li><li><b>Unidad motora:</b> neurona + fibras; pequeña en movimientos finos (ojo) y grande en músculos gruesos (abdominales).</li><li><b>Huso muscular:</b> cápsula con 8–15 fibras intrafusales (bolsa y cadena nuclear); terminaciones anuloespirales y en ramo de flores; estiramiento → contracción refleja.</li><li><b>Órgano tendinoso de Golgi:</b> en el tendón; estiramiento → inhibe motoneuronas → relajación.</li></ul>`],
[2,"Describí el músculo cardíaco.",`<ul><li>Miocardio; origen en el mesodermo lateral esplácnico sin fusión celular.</li><li>MO: células ramificadas, núcleo central con halo, estrías, discos intercalares, sin células satélite.</li><li>MET: túbulos T anchos en la línea Z, díadas, mitocondrias abundantes, mioglobina.</li><li>Disco intercalar: transversal (zonula adherens y desmosomas) y lateral (nexos).</li><li>Contracción rítmica y espontánea por células de conducción; el SNA regula la frecuencia.</li><li>No regenera: el infarto cicatriza con conectivo.</li></ul>`],
[3,"Describí el músculo liso: estructura, contracción, tipos y crecimiento.",`<ul><li>Células fusiformes con un núcleo central, sin estrías; haces o láminas.</li><li>MET: lámina externa, finos abundantes, gruesos con cabezas en toda la extensión, desmina y vimentina, cuerpos densos con α-actinina, cavéolas + REL.</li><li>Contracción: Ca2+ → calmodulina → MLCK → fosforilación de la miosina; lenta, mayor acortamiento, duradera; tono con poco ATP (miosina defosforilada que no se suelta).</li><li>Unitario (nexos, peristaltismo) y multiunitario (iris, arteriolas).</li><li>Crece por hipertrofia e hiperplasia; regenera desde pericitos.</li></ul>`]
]

["Tres cartílagos", `<div class="tw"><table><tr><th></th><th>Hialino</th><th>Elástico</th><th>Fibrocartílago</th></tr><tr><td>Fibras</td><td>Colágeno II</td><td>Colágeno II + elásticas</td><td>Colágeno I + II</td></tr><tr><td>Pericondrio</td><td>Sí (no en articulaciones)</td><td>Sí</td><td>No</td></tr><tr><td>Condrocitos</td><td>Grupos isógenos</td><td>Más y más grandes</td><td>Hileras entre fibras</td></tr><tr><td>Ejemplos</td><td>Tráquea, laringe, costillas, articulaciones, placa epifisaria</td><td>Epiglotis, pabellón auricular</td><td>Discos intervertebrales, sínfisis púbica, inserciones tendinosas</td></tr></table></div>`],
["Células formadoras y sus matrices", `<div class="tw"><table><tr><th>Tejido</th><th>Progenitora</th><th>Célula joven (secreta)</th><th>Célula madura (atrapada)</th><th>Destructora</th></tr><tr><td>Conectivo</td><td>Mesenquimática</td><td>Fibroblasto</td><td>Fibrocito</td><td>Macrófago</td></tr><tr><td>Cartílago</td><td>Condrogénica (baja O2)</td><td>Condroblasto</td><td>Condrocito (laguna)</td><td>—</td></tr><tr><td>Hueso</td><td>Osteoprogenitora (alta O2)</td><td>Osteoblasto</td><td>Osteocito (laguna)</td><td>Osteoclasto (origen hematopoyético)</td></tr></table></div>`],
["Tres músculos", `<div class="tw"><table><tr><th></th><th>Esquelético</th><th>Cardíaco</th><th>Liso</th></tr><tr><td>Forma</td><td>Cilíndrica, muy larga</td><td>Cilíndrica ramificada</td><td>Fusiforme</td></tr><tr><td>Núcleos</td><td>Muchos, periféricos</td><td>1 central con halo</td><td>1 central</td></tr><tr><td>Estrías</td><td>Sí</td><td>Sí, menos marcadas</td><td>No</td></tr><tr><td>Unión típica</td><td>—</td><td>Disco intercalar</td><td>Nexos (unitario)</td></tr><tr><td>Sistema T</td><td>Tríada, unión A-I</td><td>Díada, línea Z</td><td>Cavéolas</td></tr><tr><td>Anclaje de actina</td><td>Línea Z</td><td>Línea Z y zonula adherens</td><td>Cuerpos densos</td></tr><tr><td>Sensor de Ca2+</td><td>Troponina C</td><td>Troponina C</td><td>Calmodulina</td></tr><tr><td>Control</td><td>Voluntario</td><td>Espontáneo + SNA</td><td>SNA</td></tr><tr><td>Regeneración</td><td>Células satélite</td><td>No</td><td>Pericitos</td></tr></table></div>`],
["Tejidos y su origen embrionario", `<div class="tw"><table><tr><th>Hoja</th><th>Da origen a</th></tr><tr><td>Ectodermo</td><td>Epidermis, glándulas cutáneas, epitelio de boca y ano</td></tr><tr><td>Mesodermo</td><td>Conectivo y variedades, cartílago, hueso, músculo, endotelios, mesotelios, túbulos renales, vías urinarias y genitales</td></tr><tr><td>Endodermo</td><td>Epitelio del tubo digestivo, glándulas gástricas e intestinales, hígado, páncreas</td></tr><tr><td>Neuroectodermo</td><td>Tejido nervioso</td></tr></table></div>`],
["Números que suelen preguntar", `<div class="tw"><table><tr><th>Dato</th><th>Valor</th></tr><tr><td>Glóbulo rojo</td><td>≈7 µm</td></tr><tr><td>LR del MO / ojo / MET / MEB</td><td>0,2 µm / 0,2 mm / ≈1 Å / ≈25 nm</td></tr><tr><td>Formol</td><td>10%, 20–40:1, 24 h por cm³</td></tr><tr><td>Muestra MO / MET</td><td>1 cm³ / 1,5 mm³</td></tr><tr><td>Parafina</td><td>Líquida a 45–70 °C</td></tr><tr><td>Cortes MO / semifinos / ultrafinos</td><td>3–10 µm / 0,5–1 µm / 40–70 nm</td></tr><tr><td>Agua del cartílago hialino</td><td>60–80%</td></tr><tr><td>Hueso: inorgánico / orgánico</td><td>65% / 35% del peso seco</td></tr><tr><td>Osteoclasto</td><td>≈150 µm, hasta 50 núcleos</td></tr><tr><td>Adipocito unilocular</td><td>≈120 µm</td></tr><tr><td>Molécula de colágeno / bandas</td><td>300 × 1,5 nm / 68 nm</td></tr><tr><td>Fibra elástica</td><td>Se estira 150%</td></tr><tr><td>Renovación intestino / epidermis</td><td>≈6 días / ≈1 mes</td></tr><tr><td>Tropomiosina</td><td>Cubre 7 actinas G</td></tr><tr><td>Filamento grueso</td><td>200–300 miosinas</td></tr><tr><td>Golpe de fuerza</td><td>≈10 nm, de 90° a 45°</td></tr><tr><td>Huso muscular</td><td>8–15 fibras intrafusales</td></tr></table></div>`]
];

</script>
<script>
const KEY = "histo1-repaso-v1";
const S = (() => {
  const d = { known: {}, review: {}, best: {}, wrong: {}, theme: null };
  try { const r = JSON.parse(localStorage.getItem(KEY) || "null"); if (r) return Object.assign(d, r); } catch (e) {}
  return d;
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const NIV = { 1: "Básico", 2: "Intermedio", 3: "Avanzado" };
const lvl = n => `<span class="lvl l${n}">${NIV[n]}</span>`;
const app = document.getElementById("app");
const nav = document.getElementById("nav");
let keyHandler = null;

TEMAS.forEach(t => {
  t.corto = t.nombre.replace("Tejido ", "").replace(/^./, c => c.toUpperCase());
  t.fc = t.fc.map((x, i) => ({ id: t.id + "-f" + i, n: x[0], q: x[1], a: x[2] }));
  t.mc = t.mc.map((x, i) => ({ id: t.id + "-m" + i, tema: t.id, n: x[0], q: x[1], o: x[2], e: x[3] }));
  t.vf = t.vf.map(x => ({ n: x[0], s: x[1], v: x[2], e: x[3] }));
  t.dev = t.dev.map(x => ({ n: x[0], q: x[1], a: x[2] }));
  ["fc", "mc", "vf", "dev"].forEach(k => t[k].sort((a, b) => a.n - b.n));
});
const TBYID = Object.fromEntries(TEMAS.map(t => [t.id, t]));
const ALLMC = TEMAS.flatMap(t => t.mc);
const MCBYID = Object.fromEntries(ALLMC.map(q => [q.id, q]));

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mastery(t) {
  const k = t.fc.filter(c => S.known[c.id]).length;
  return Math.round(k / t.fc.length * 50 + (S.best[t.id] || 0) / 2);
}
function wrongCount() { return Object.keys(S.wrong).filter(id => MCBYID[id]).length; }

/* ---------- Tema (claro/oscuro) ---------- */
const themeBtn = document.getElementById("theme");
function effTheme() { return S.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function applyTheme() {
  if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);
  else document.documentElement.removeAttribute("data-theme");
  themeBtn.textContent = effTheme() === "dark" ? "Modo día" : "Modo noche";
}
themeBtn.onclick = () => { S.theme = effTheme() === "dark" ? "light" : "dark"; save(); applyTheme(); };
applyTheme();

/* ---------- Navegación ---------- */
function route() {
  const p = location.hash.replace(/^#\/?/, "").split("/");
  if (p[0] === "t" && TBYID[p[1]]) return { p: "tema", id: p[1], m: p[2] || "res" };
  if (["comp", "sim", "err"].includes(p[0])) return { p: p[0] };
  return { p: "home" };
}
function go(h) { location.hash = h; }
function drawNav(r) {
  const items = [["#/", "Inicio", r.p === "home"]]
    .concat(TEMAS.map(t => ["#/t/" + t.id, t.corto, r.p === "tema" && r.id === t.id]))
    .concat([["#/comp", "Tablas comparativas", r.p === "comp", 1], ["#/sim", "Simulacro", r.p === "sim", 1], ["#/err", "Mis errores (" + wrongCount() + ")", r.p === "err", 1]]);
  nav.innerHTML = items.map(([h, l, cur, alt]) => `<a class="chip${alt ? " alt" : ""}" href="${h}"${cur ? ' aria-current="page"' : ""}>${l}</a>`).join("");
  const cur = nav.querySelector('[aria-current="page"]');
  if (cur) cur.scrollIntoView({ block: "nearest", inline: "center" });
}
let lastPage = "";
function render() {
  keyHandler = null;
  const r = route();
  drawNav(r);
  const pageKey = r.p + (r.id || "");
  if (pageKey !== lastPage) { window.scrollTo(0, 0); lastPage = pageKey; }
  if (r.p === "home") home();
  else if (r.p === "tema") tema(TBYID[r.id], r.m);
  else if (r.p === "comp") comp();
  else if (r.p === "sim") sim();
  else if (r.p === "err") errores();
}
window.addEventListener("hashchange", render);
nav.addEventListener("click", e => { const a = e.target.closest("a"); if (a && a.getAttribute("href") === location.hash) { e.preventDefault(); lastPage = ""; render(); } });
document.addEventListener("keydown", e => {
  if (!keyHandler) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "input") return;
  keyHandler(e);
});

/* ---------- Inicio ---------- */
function home() {
  const rows = TEMAS.map(t => {
    const m = mastery(t);
    return `<li><a class="trow" href="#/t/${t.id}">
      <span class="tn">${t.nombre}</span>
      <span class="pct">${m}% dominado</span>
      <span class="tc">${t.fc.length} flashcards, ${t.mc.length} de opción múltiple, ${t.vf.length} de V o F, ${t.dev.length} a desarrollo</span>
      <span class="stain" aria-hidden="true"><i style="width:${m}%"></i></span></a></li>`;
  }).join("");
  const tot = k => TEMAS.reduce((s, t) => s + t[k].length, 0);
  app.innerHTML = `<p class="intro">En cada tema: leé el resumen, pasá las flashcards y después probate con las preguntas. Todo está ordenado de lo básico a lo avanzado. La barra de cada tema se va «tiñendo» con las flashcards que sabés y tu mejor puntaje de opción múltiple; el progreso queda guardado en este navegador.</p>
  <ul class="tlist">${rows}</ul>
  <div class="extras">
    <a class="btn" href="#/comp">Tablas comparativas</a>
    <a class="btn pri" href="#/sim">Simulacro mezclado</a>
    <a class="btn" href="#/err">Repasar mis errores (${wrongCount()})</a>
  </div>
  <p class="src" style="margin-top:22px">En total: ${tot("fc")} flashcards, ${tot("mc")} preguntas de opción múltiple, ${tot("vf")} de verdadero o falso y ${tot("dev")} a desarrollo con respuesta modelo.</p>`;
}

/* ---------- Página de tema ---------- */
const MODES = [["res", "Resumen"], ["fc", "Flashcards"], ["mc", "Opción múltiple"], ["vf", "V o F"], ["dev", "A desarrollo"]];
function tema(t, m) {
  app.innerHTML = `<h2>${t.nombre}</h2><p class="src">${t.fuente}</p>
  <div class="modes" role="tablist">${MODES.map(([k, l]) => `<button role="tab" aria-selected="${k === m}" data-m="${k}">${l}</button>`).join("")}</div>
  <div id="pane"></div>`;
  app.querySelectorAll(".modes button").forEach(b => b.onclick = () => go("#/t/" + t.id + "/" + b.dataset.m));
  const pane = document.getElementById("pane");
  if (m === "res") resumen(pane, t);
  else if (m === "fc") flash(pane, t);
  else if (m === "mc") quiz(pane, shuffleByLevel(t.mc), { tema: t });
  else if (m === "vf") vf(pane, t);
  else if (m === "dev") dev(pane, t);
}
function shuffleByLevel(list) {
  return [1, 2, 3].flatMap(n => shuffle(list.filter(q => q.n === n)));
}

function resumen(el, t) {
  el.innerHTML = t.resumen.map(([h, b]) => `<details class="sec" open><summary>${h}</summary>${b}</details>`).join("") +
    `<div class="bar" style="margin-top:12px"><button class="btn pri" data-go="fc">Seguir con las flashcards</button></div>`;
  el.querySelector("[data-go]").onclick = () => go("#/t/" + t.id + "/fc");
}

/* ---------- Flashcards ---------- */
function flash(el, t) {
  let onlyRev = false, order = t.fc.map((_, i) => i), i = 0, show = false;
  const list = () => order.map(k => t.fc[k]).filter(c => !onlyRev || S.review[c.id]);
  function draw() {
    const L = list();
    const known = t.fc.filter(c => S.known[c.id]).length;
    const rev = t.fc.filter(c => S.review[c.id]).length;
    let body;
    if (!L.length) {
      body = `<div class="empty">No marcaste tarjetas para repasar en este tema. Desactivá el filtro para ver todas.</div>`;
    } else {
      if (i >= L.length) i = L.length - 1;
      const c = L[i];
      const cls = S.known[c.id] ? " known" : S.review[c.id] ? " review" : "";
      body = `<button class="card${cls}" id="card" aria-live="polite">
        <span>${lvl(c.n)}</span>
        <span class="q">${c.q}</span>
        ${show ? `<span class="a">${c.a}</span>` : ""}
        <span class="hint">${show ? "" : "Tocá la tarjeta o apretá espacio para ver la respuesta. "}Tarjeta ${i + 1} de ${L.length}.</span>
      </button>
      <div class="fcnav">
        <button class="btn" id="prev" ${i === 0 ? "disabled" : ""}>Anterior</button>
        <button class="btn" id="next" ${i === L.length - 1 ? "disabled" : ""}>Siguiente</button>
        <button class="btn ok" id="yes">La sé</button>
        <button class="btn bad" id="no">A repasar</button>
      </div>`;
    }
    el.innerHTML = `<div class="bar">
      <span>Sabés <b>${known}</b> de ${t.fc.length}. Para repasar: <b>${rev}</b>.</span><span class="grow"></span>
      <label class="tog"><input type="checkbox" id="only" ${onlyRev ? "checked" : ""}> Solo las marcadas para repasar</label>
      <button class="btn" id="mix">Mezclar</button><button class="btn" id="ord">Orden por nivel</button>
    </div>${body}`;
    el.querySelector("#only").onchange = e => { onlyRev = e.target.checked; i = 0; show = false; draw(); };
    el.querySelector("#mix").onclick = () => { order = shuffle(order); i = 0; show = false; draw(); };
    el.querySelector("#ord").onclick = () => { order = t.fc.map((_, k) => k); i = 0; show = false; draw(); };
    if (!L.length) return;
    const c = L[i];
    el.querySelector("#card").onclick = () => { show = !show; draw(); };
    el.querySelector("#prev").onclick = () => move(-1);
    el.querySelector("#next").onclick = () => move(1);
    el.querySelector("#yes").onclick = () => { S.known[c.id] = 1; delete S.review[c.id]; save(); advance(); };
    el.querySelector("#no").onclick = () => { S.review[c.id] = 1; delete S.known[c.id]; save(); advance(); };
  }
  function move(d) { const L = list(); i = Math.max(0, Math.min(L.length - 1, i + d)); show = false; draw(); }
  function advance() { const L = list(); if (i < L.length - 1 && !onlyRev) i++; show = false; draw(); }
  keyHandler = e => {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); show = !show; draw(); }
    else if (e.key === "ArrowRight") move(1);
    else if (e.key === "ArrowLeft") move(-1);
  };
  draw();
}

/* ---------- Opción múltiple (motor común) ---------- */
function quiz(el, items, opt = {}) {
  const qs = items.map(it => ({ ...it, ord: shuffle(it.o.map((_, k) => k)) }));
  let i = 0, ok = 0, ans = null;
  const res = [];
  if (!qs.length) { el.innerHTML = `<div class="empty">No hay preguntas para mostrar.</div>`; return; }
  function draw() {
    if (i >= qs.length) return end();
    const q = qs[i];
    const tag = opt.mixed ? ` <span class="lvl l2">${TBYID[q.tema].corto}</span>` : "";
    el.innerHTML = `<div class="bar"><span>Pregunta ${i + 1} de ${qs.length}</span><span class="grow"></span><span>Aciertos: ${ok}</span></div>
      <div class="prog"><i style="width:${i / qs.length * 100}%"></i></div>
      <div class="qbox">${lvl(q.n)}${tag}
        <div class="q">${q.q}</div>
        <div class="opts">${q.ord.map((k, j) => `<button class="opt" data-k="${k}"><span class="k">${"abcd"[j]}</span><span>${q.o[k]}</span></button>`).join("")}</div>
        <div id="fbk"></div>
      </div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));
  }
  function pick(k) {
    if (ans !== null) return;
    ans = k;
    const q = qs[i], right = k === 0;
    if (right) { ok++; delete S.wrong[q.id]; } else { S.wrong[q.id] = 1; }
    res.push({ q, right });
    save();
    el.querySelectorAll(".opt").forEach(b => {
      b.disabled = true;
      const kk = +b.dataset.k;
      if (kk === 0) b.classList.add("right");
      else if (kk === k) b.classList.add("wrong");
    });
    const last = i === qs.length - 1;
    el.querySelector("#fbk").innerHTML = `<div class="fb ${right ? "okk" : "no"}">${right ? "<b>Correcto.</b>" : `<b>Incorrecto.</b> La respuesta es: ${q.o[0]}.`}${q.e ? " " + q.e : ""}</div>
      <div class="bar" style="margin:12px 0 0"><span class="grow"></span><button class="btn pri" id="nx">${last ? "Ver resultado" : "Siguiente"}</button></div>`;
    const nx = el.querySelector("#nx");
    nx.onclick = next; nx.focus({ preventScroll: true });
  }
  function next() { i++; ans = null; draw(); window.scrollTo({ top: el.offsetTop - 80 }); }
  function end() {
    keyHandler = null;
    const pct = Math.round(ok / qs.length * 100);
    if (opt.tema) { S.best[opt.tema.id] = Math.max(S.best[opt.tema.id] || 0, pct); save(); }
    const miss = res.filter(r => !r.right);
    let byT = "";
    if (opt.mixed) {
      const g = {};
      res.forEach(r => { const k = r.q.tema; g[k] = g[k] || [0, 0]; g[k][1]++; if (r.right) g[k][0]++; });
      byT = `<div class="tw"><table><tr><th>Tema</th><th>Aciertos</th></tr>${Object.entries(g).map(([k, [a, b]]) => `<tr><td>${TBYID[k].nombre}</td><td>${a} de ${b}</td></tr>`).join("")}</table></div>`;
    }
    const msg = pct >= 90 ? "Excelente, esto está sólido." : pct >= 70 ? "Bien. Repasá las que fallaste y volvé a intentar." : "Conviene volver al resumen y a las flashcards de este tema antes de repetir.";
    el.innerHTML = `<div class="qbox"><p class="sans muted" style="margin:0">Resultado</p>
      <div class="score">${ok} / ${qs.length}</div><p style="margin:0 0 12px">${pct}% de aciertos. ${msg}</p>
      ${byT}
      ${miss.length ? `<h3 style="margin-top:16px">Para revisar</h3><ul class="miss">${miss.map(r => `<li><b>${r.q.q}</b><br>Respuesta: ${r.q.o[0]}${r.q.e ? `<br><span class="muted">${r.q.e}</span>` : ""}</li>`).join("")}</ul>` : ""}
      <div class="bar" style="margin:16px 0 0"><button class="btn pri" id="again">Hacer de nuevo</button>${miss.length ? `<a class="btn" href="#/err">Ir a mis errores</a>` : ""}</div></div>`;
    el.querySelector("#again").onclick = () => (opt.again ? opt.again() : render());
    drawNav(route());
  }
  keyHandler = e => {
    const map = { a: 0, b: 1, c: 2, d: 3, 1: 0, 2: 1, 3: 2, 4: 3 };
    const k = e.key.toLowerCase();
    if (ans === null && k in map && i < qs.length) { const b = el.querySelectorAll(".opt")[map[k]]; if (b) b.click(); }
    else if (ans !== null && e.key === "Enter") { e.preventDefault(); next(); }
  };
  draw();
}

/* ---------- Verdadero o falso ---------- */
function vf(el, t) {
  let done = 0, ok = 0;
  el.innerHTML = `<div class="bar"><span id="vfc">Respondidas: 0 de ${t.vf.length}</span><span class="grow"></span><button class="btn" id="rst">Reiniciar</button></div>
  <ul class="vf">${t.vf.map((x, i) => `<li data-i="${i}">${lvl(x.n)}<p class="st">${x.s}</p>
    <div class="row"><button class="btn" data-v="1">Verdadero</button><button class="btn" data-v="0">Falso</button></div><div class="out"></div></li>`).join("")}</ul>`;
  el.querySelector("#rst").onclick = () => vf(el, t);
  el.querySelectorAll(".vf li").forEach(li => {
    const x = t.vf[+li.dataset.i];
    li.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
      const v = b.dataset.v === "1", right = v === x.v;
      done++; if (right) ok++;
      li.querySelectorAll("[data-v]").forEach(bb => { bb.disabled = true; if ((bb.dataset.v === "1") === x.v) bb.classList.add("ok"); else if (bb === b) bb.classList.add("bad"); });
      li.querySelector(".out").innerHTML = `<div class="fb ${right ? "okk" : "no"}"><b>${right ? "Correcto" : "Incorrecto"}.</b> Es ${x.v ? "verdadero" : "falso"}.${x.e ? " " + x.e : ""}</div>`;
      el.querySelector("#vfc").textContent = `Respondidas: ${done} de ${t.vf.length}. Aciertos: ${ok}.`;
    });
  });
}

/* ---------- Desarrollo ---------- */
function dev(el, t) {
  el.innerHTML = `<p class="muted sans" style="margin-top:0">Intentá responder (de cabeza o escribiendo) y después compará con la respuesta modelo.</p>
  <ul class="dev">${t.dev.map((x, i) => `<li>${lvl(x.n)}<p class="q">${x.q}</p>
    <textarea aria-label="Tu respuesta" placeholder="Tu respuesta (opcional)"></textarea>
    <div class="bar" style="margin:10px 0 0"><button class="btn" data-i="${i}">Ver respuesta modelo</button></div>
    <div class="model" hidden>${x.a}</div></li>`).join("")}</ul>`;
  el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    const m = b.closest("li").querySelector(".model");
    m.hidden = !m.hidden;
    b.textContent = m.hidden ? "Ver respuesta modelo" : "Ocultar respuesta modelo";
  });
}

/* ---------- Comparativos ---------- */
function comp() {
  app.innerHTML = `<h2>Tablas comparativas</h2><p class="src">Lo que más se confunde entre temas, puesto lado a lado.</p>` +
    COMPARATIVOS.map(([h, b]) => `<details class="sec" open><summary>${h}</summary>${b}</details>`).join("");
}

/* ---------- Simulacro ---------- */
function sim() {
  app.innerHTML = `<h2>Simulacro mezclado</h2><p class="src">Preguntas al azar de todos los temas, con el resultado por tema al final.</p>
  <div class="qbox"><p style="margin-top:0">¿Cuántas preguntas?</p>
  <div class="bar" style="margin:0"><button class="btn" data-n="15">15</button><button class="btn pri" data-n="30">30</button><button class="btn" data-n="50">50</button><button class="btn" data-n="${ALLMC.length}">Todas (${ALLMC.length})</button></div></div><div id="pane"></div>`;
  app.querySelectorAll("[data-n]").forEach(b => b.onclick = () => start(+b.dataset.n));
  function start(n) {
    const pick = shuffle(ALLMC).slice(0, n);
    app.innerHTML = `<h2>Simulacro mezclado</h2><p class="src">${n} preguntas de todos los temas.</p><div id="pane"></div>`;
    quiz(document.getElementById("pane"), pick, { mixed: true, again: () => start(n) });
  }
}

/* ---------- Mis errores ---------- */
function errores() {
  const ids = Object.keys(S.wrong).filter(id => MCBYID[id]);
  app.innerHTML = `<h2>Mis errores</h2><p class="src">Las preguntas de opción múltiple que fallaste. Cuando las acertás, salen de la lista.</p><div id="pane"></div>`;
  const pane = document.getElementById("pane");
  if (!ids.length) { pane.innerHTML = `<div class="empty">No tenés errores guardados. Hacé las preguntas de algún tema o un simulacro.</div>`; return; }
  pane.innerHTML = `<div class="qbox"><p style="margin-top:0">Tenés <b>${ids.length}</b> preguntas para repasar.</p>
    <div class="bar" style="margin:0"><button class="btn pri" id="go">Empezar</button><button class="btn" id="clr">Vaciar la lista</button></div></div>`;
  pane.querySelector("#go").onclick = () => quiz(pane, shuffle(ids.map(id => MCBYID[id])), { mixed: true, again: () => render() });
  pane.querySelector("#clr").onclick = () => { if (confirm("¿Vaciar la lista de errores?")) { S.wrong = {}; save(); render(); } };
}

render();

</script>
</body>
</html>
